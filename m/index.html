<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2721">
<title>山静日长 · 地球 Online · 人生副本（rev12 手机版）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: #efe8da;
    background-image:
      linear-gradient(rgba(31, 42, 36, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31, 42, 36, .045) 1px, transparent 1px);
    background-size: 4px 4px;
    color: #1f2a24;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 430px;
    margin: 0 auto;
    padding: 14px 14px 34px;
  }

  /* 横幅 */
  .banner {
    display: block;
    width: 100%;
    height: auto;
    border: 2px solid #1f2a24;
    box-shadow: 4px 4px 0 rgba(31, 42, 36, .18);
    image-rendering: pixelated;
    margin-bottom: 12px;
    background: #1b2721;
  }

  .head { margin: 0 0 14px; }
  .head h1 {
    margin: 0;
    font-size: 17px;
    letter-spacing: .22em;
    font-weight: 700;
  }
  .head .sub {
    margin: 4px 0 0;
    font-size: 12px;
    letter-spacing: .08em;
    color: #5c6b5f;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    align-items: center;
  }
  .head .sub .sep { color: #b9ad93; }

  .card {
    background: #fffdf7;
    border: 2px solid #1f2a24;
    box-shadow: 4px 4px 0 rgba(31, 42, 36, .16);
    padding: 14px;
    margin: 0 0 12px;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .chip {
    font-size: 12px;
    letter-spacing: .06em;
    padding: 1px 8px;
    border: 2px solid #1f2a24;
    background: #f0e7d3;
    line-height: 1.7;
  }
  .chip.solid { background: #2f6f52; border-color: #234f3b; color: #fff; }

  .body {
    margin: 0 0 14px;
    font-size: 16px;
    line-height: 1.85;
    overflow-wrap: anywhere;
  }

  .btn {
    display: block;
    width: 100%;
    margin: 0;
    padding: 12px;
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    text-align: left;
    color: #1f2a24;
    background: #fffdf7;
    border: 2px solid #1f2a24;
    border-radius: 0;
    box-shadow: 3px 3px 0 rgba(31, 42, 36, .18);
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    overflow-wrap: anywhere;
  }
  .btn + .btn { margin-top: 10px; }
  .btn:hover { background: #f7efdd; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(31, 42, 36, .18); }
  .btn:focus-visible { outline: 3px solid #b4543a; outline-offset: 2px; }
  .btn.primary {
    background: #2f6f52;
    border-color: #234f3b;
    color: #fff;
    box-shadow: 3px 3px 0 rgba(35, 79, 59, .35);
  }
  .btn.primary:hover { background: #357c5b; }
  .btn.ghost { background: transparent; box-shadow: none; color: #43514a; }

  .hint {
    margin: 12px 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: #7a7a68;
  }

  .panel {
    background: #fffdf7;
    border: 2px dashed #b9ad93;
    padding: 12px 14px;
    margin: 0 0 12px;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .16em;
    color: #5c6b5f;
  }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li {
    border-left: 3px solid #2f6f52;
    padding: 1px 0 1px 10px;
    margin: 0 0 9px;
  }
  .log li:last-child { margin-bottom: 0; }
  .log .k {
    display: block;
    font-size: 12px;
    letter-spacing: .04em;
    color: #5c6b5f;
  }
  .log .v { display: block; font-size: 14px; line-height: 1.72; overflow-wrap: anywhere; }
  .log li.empty { border-left-color: #cfc6b4; }
  .log li.empty .v { color: #8b8672; }

  .coverage {
    border-style: solid;
    border-color: #1f2a24;
    background: #f0e7d3;
    font-size: 13px;
    letter-spacing: .06em;
    color: #43514a;
  }

  /* 盾公式结果区与采集表单（沿用面板风格；390 宽无横向溢出） */
  .coverage h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .16em;
    color: #5c6b5f;
  }
  .coverage .note {
    margin: 0 0 8px;
    font-size: 12px;
    line-height: 1.7;
    color: #7a7a68;
    overflow-wrap: anywhere;
  }
  .coverage .cov-status {
    margin: 0 0 10px;
    font-size: 16px;
    letter-spacing: .08em;
  }
  .coverage .cov-line {
    margin: 0 0 10px;
    font-size: 14px;
    line-height: 1.8;
    overflow-wrap: anywhere;
  }
  .coverage .totals {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
  }
  .coverage .totals li {
    border-left: 3px solid #2f6f52;
    padding: 1px 0 1px 10px;
    margin: 0 0 6px;
    font-size: 13px;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }
  .coverage .field { margin: 0 0 10px; }
  .coverage .field label {
    display: block;
    font-size: 12px;
    line-height: 1.6;
    color: #43514a;
    margin: 0 0 3px;
  }
  .coverage select {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 8px;
    font: inherit;
    font-size: 14px;
    color: #1f2a24;
    background: #fffdf7;
    border: 2px solid #1f2a24;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .coverage .exRow {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .coverage .exRow.sub { margin-top: 6px; }
  .coverage .exRow label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    line-height: 1.6;
    color: #1f2a24;
  }
  .coverage table {
    width: 100%;
    max-width: 100%;
    border-collapse: collapse;
    margin: 0 0 10px;
    font-size: 13px;
    line-height: 1.6;
  }
  .coverage th, .coverage td {
    border: 1px solid #cfc6b4;
    padding: 4px 6px;
    text-align: left;
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  .coverage thead th { background: #f0e7d3; }
  .coverage .err {
    margin: 8px 0 0;
    font-size: 13px;
    color: #b4543a;
    overflow-wrap: anywhere;
  }
  .coverage .btn { margin-top: 10px; }


  /* revision-03：开局分流与自选人生（沿用既有卡片/面板风格） */
  #titleRoot, #lifeRoot { display: none; }
  body.mode-title #titleRoot { display: block; }
  body.mode-custom #lifeRoot { display: block; }
  body.mode-title #stage,
  body.mode-title .panel[aria-label="已发生"],
  body.mode-title .actions,
  body.mode-title .coverage { display: none; }
  body.mode-custom #stage,
  body.mode-custom .panel[aria-label="已发生"],
  body.mode-custom .actions { display: none; }
  #titleRoot .field { margin: 0 0 10px; }
  #titleRoot .field label {
    display: block;
    font-size: 12px;
    line-height: 1.6;
    color: #43514a;
    margin: 0 0 3px;
  }
  #titleRoot select, #titleRoot input[type="text"], #titleRoot input[type="number"] {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 8px;
    font: inherit;
    font-size: 14px;
    color: #1f2a24;
    background: #fffdf7;
    border: 2px solid #1f2a24;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  #titleRoot .err { margin: 6px 0 8px; font-size: 13px; color: #b4543a; overflow-wrap: anywhere; }
  #lifeRoot .note { margin: 0 0 8px; font-size: 12px; line-height: 1.7; color: #7a7a68; overflow-wrap: anywhere; }


  /* revision-04：同页连续追加 + 折叠侧栏 + 控件条 */
  .title-root { display: none; }
  .story-stream { display: none; }
  .story-item { margin: 0 0 12px; }
  .story-item .card { margin: 0; }
  .flow-dock {
    display: none; position: sticky; bottom: 0; z-index: 5;
    gap: 8px; padding: 8px 4px; background: #efe8da;
    border-top: 2px dashed #b9ad93; margin: 4px 0 0;
  }
  .flow-dock .btn {
    width: auto; flex: 1 1 0; margin: 0; box-shadow: none;
    text-align: center; font-size: 13px; padding: 9px 4px; line-height: 1.4;
  }
  .flow-dock .btn:disabled { opacity: .42; cursor: not-allowed; }
  .flow-dock[data-state="ended"] [data-flow-act="resume"],
  .flow-dock[data-state="choice"] [data-flow-act="resume"] { opacity: .42; }
  .side-dock { margin: 10px 0 0; }
  .side-dock .cov-summary {
    margin: 0 0 8px; font-size: 13px; letter-spacing: .04em;
    color: #43514a; padding: 6px 10px; border: 2px dashed #b9ad93; background: #fffdf7;
  }
  .side-dock[data-open="false"] .cov-summary { margin: 0; }
  .side-dock[data-open="false"] > .coverage,
  .side-dock[data-open="false"] > .panel { display: none; }
  .side-dock[data-open="true"] .coverage { display: block; }
  /* 故事先入：演示/自选模式下 #stage 退为隐藏源；.actions 在标题/自选下不显示（基线已禁），演示下保留跳龄按钮 */
  body.mode-demo #stage, body.mode-custom #stage { display: none !important; }
  body.mode-title #storyStream, body.mode-title #flowDock, body.mode-title #sideDock { display: none !important; }
  body.mode-title .actions { display: none !important; }


  /* revision-04-fix01：已发生普通叙事去边框/逐卡标签，合并为连贯段落；只突出当前待选/终点 */
  .story-item { margin: 0; }
  .story-item.flow { margin: 0 0 11px; }
  .story-item.flow .prose {
    margin: 0; font-size: 15.5px; line-height: 1.9; color: #2f3a33;
    overflow-wrap: anywhere; padding: 0 2px;
  }
  .story-item.focus { margin: 0 0 14px; }
  .story-item.focus .card {
    margin: 0; border-color: #2f6f52;
    box-shadow: 4px 4px 0 rgba(47,111,82,.30);
  }
  .story-item.focus .meta .chip.solid { background: #2f6f52; border-color: #234f3b; color: #fff; }
  .story-item.flow + .story-item.focus,
  .story-item.focus + .story-item.flow { margin-top: 6px; }

  .actions { margin-top: 4px; }

/* ===== revision-05 layers ===== */
/* =====================================================================
   revision-05 CSS — 开场 + 参考式三列 + 人生格子 + 保险雷达 + 抽屉
   桌面 26:47:27；390 竖排折叠、入口常驻、一次展开一图。
   ===================================================================== */
:root { --ink:#1f2a24; --paper:#fffdf7; --green:#2f6f52; --gold:#e0a94f; --line:#1f2a24; --muted:#5c6b5f; }

/* ---------- 开场 ---------- */
.screen.opening { position:fixed; inset:0; z-index:200; background:#0b0e12; overflow:hidden; transition:opacity .45s ease; }
.opening-bg { position:absolute; inset:0; background:radial-gradient(120% 42% at 50% 100%,#3a2c1c66 0%,transparent 70%),radial-gradient(90% 34% at 50% 0%,#1a2438aa 0%,transparent 70%),#0b0e12; }
.opening-bg.reduced { background:#10141c; }
.opening-ground { position:absolute; left:0; right:0; bottom:0; height:22%; background:linear-gradient(180deg,#4a3a28 0%,#2a2016 60%,#1a140e 100%); border-top:2px solid #6b533c; }
.opening-stars { position:absolute; inset:0 0 22% 0; opacity:.65; background-image:radial-gradient(1px 1px at 20% 30%,#f4ead6,transparent),radial-gradient(1px 1px at 60% 20%,#f4ead6,transparent),radial-gradient(1px 1px at 80% 40%,#c9b07a,transparent),radial-gradient(2px 2px at 40% 15%,#f4ead6,transparent),radial-gradient(1px 1px at 70% 52%,#c9b07a,transparent),radial-gradient(1px 1px at 12% 62%,#f4ead6,transparent); }
.walker-stage { position:absolute; left:0; right:0; bottom:20%; height:34%; display:flex; align-items:flex-end; justify-content:center; gap:clamp(18px,8vw,80px); }
.walker { position:relative; width:clamp(64px,14vw,104px); }
.walker-img { width:100%; height:auto; display:block; image-rendering:auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.walker.traveler { animation:walk-in 3.1s cubic-bezier(.22,.7,.25,1) both,bob .8s ease-in-out .4s infinite; }
.walker.companion { animation:walk-in 3.3s cubic-bezier(.22,.7,.25,1) .25s both,bob .9s ease-in-out .5s infinite; }
.walker.static .walker-img { animation:none; }
@keyframes walk-in { from{ opacity:0; transform:translateX(-60vw) translateY(6px); } to{ opacity:1; transform:translateX(0) translateY(0); } }
@keyframes bob { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
.opening-copy { position:absolute; left:0; right:0; top:16%; text-align:center; color:#f3ead6; padding:0 18px; }
.opening-copy .welcome { margin:0 0 10px; font-size:clamp(22px,6vw,38px); letter-spacing:.24em; font-weight:800; text-shadow:0 2px 18px #000; }
.opening-copy .quest-chip { display:inline-block; margin:0 0 14px; padding:4px 16px; border:2px solid #e0a94f; color:#f0c878; letter-spacing:.32em; font-size:clamp(13px,3.4vw,18px); font-weight:700; }
.opening-copy .lead { max-width:560px; margin:0 auto 20px; line-height:1.9; font-size:clamp(13px,3.4vw,16px); color:#d9d2c0; }
.opening-choices { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.screen.opening .btn { width:auto; min-width:150px; }

/* ---------- 主体/虚构预设选择层 ---------- */
.subject-gate { position:fixed; inset:0; z-index:180; background:rgba(16,20,28,.96); display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
.gate-card { width:100%; max-width:620px; background:var(--paper); border:2px solid var(--ink); box-shadow:6px 6px 0 rgba(0,0,0,.35); padding:clamp(18px,4vw,30px); }
.gate-card h2 { margin:0 0 6px; font-size:clamp(18px,4.6vw,24px); letter-spacing:.12em; }
.gate-card .lead { margin:0 0 18px; color:var(--muted); line-height:1.8; }
.subject-options { display:grid; gap:12px; }
.subject-options .btn { text-align:left; }
.subject-options .btn small { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:3px; }
.subject-options .btn.primary small { color:#dcefe4; }
.preset-info { margin-top:16px; padding:12px; border:2px dashed var(--gold); background:#fffaf0; }
.preset-info .preset-label { margin:0 0 6px; font-weight:700; color:#8a6a20; letter-spacing:.08em; }
.preset-info p { margin:0; font-size:13px; line-height:1.75; }

/* ---------- 本人采集表单 ---------- */
.self-form { padding:4px 0; }
.self-form h2 { margin:0 0 8px; font-size:20px; }
.self-form .field { margin:0 0 12px; }
.self-form .field label { display:block; font-size:13px; color:#43514a; margin:0 0 4px; }
.self-form input, .self-form select { display:block; width:100%; padding:9px; font:inherit; font-size:14px; border:2px solid var(--ink); background:#fff; }
.self-form .btn-row { display:flex; gap:10px; flex-wrap:wrap; }
.self-form .btn { width:auto; flex:1 1 140px; text-align:center; }

/* ---------- 三列主布局 ---------- */
.r05-shell { max-width:1320px; margin:0 auto; padding:12px 12px 28px; }
.r05-top { position:sticky; top:0; z-index:20; display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 14px; padding:8px 12px; border:2px solid var(--ink); background:#f0e7d3; margin-bottom:10px; }
.r05-top .tb-main { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; font-size:13px; letter-spacing:.04em; }
.r05-top .tb-main b { font-size:15px; }
.r05-top .tb-main .sep { color:#b9ad93; }
.r05-top .tb-ctrl { display:flex; gap:6px; flex-wrap:wrap; }
.r05-top .btn { width:auto; padding:6px 10px; font-size:12px; box-shadow:none; }
.r05-cols { display:grid; grid-template-columns:26fr 47fr 27fr; gap:10px; align-items:start; }
.r05-col { min-width:0; }
.r05-col.left, .r05-col.right { position:sticky; top:8px; }
.r05-panel { background:var(--paper); border:2px solid var(--ink); box-shadow:3px 3px 0 rgba(31,42,36,.14); padding:11px; margin:0 0 10px; }
.r05-panel h4 { margin:0 0 8px; font-size:13px; letter-spacing:.1em; padding-bottom:5px; border-bottom:2px solid #e5dcc6; }
.r05-panel .empty { margin:0; font-size:12px; color:#9a917c; }
.r05-panel ul { margin:0; padding-left:18px; }
.r05-panel li { font-size:12.5px; line-height:1.75; }

/* 中列：场景 + 连续正文 */
.scene-banner .scene-img, .pixel-scene { position:relative; height:126px; border:2px solid var(--ink); overflow:hidden; background:#1b2721; }
.pixel-scene .ps-ground { position:absolute; left:0; right:0; bottom:0; height:26px; opacity:.75; }
.pixel-scene .ps-window { position:absolute; top:20px; left:22px; width:56px; height:44px; opacity:.55; border:2px solid rgba(255,255,255,.18); }
.pixel-scene .ps-figure { position:absolute; bottom:26px; right:32px; width:16px; height:34px; background:#e9dfc0; border:2px solid var(--ink); opacity:.85; }
.pixel-scene .ps-figure::before { content:''; position:absolute; top:-12px; left:2px; width:12px; height:12px; border-radius:50%; background:#e9dfc0; border:2px solid var(--ink); }
.pixel-scene .ps-label { position:absolute; left:8px; bottom:8px; color:#f3ead6; font-size:12px; letter-spacing:.08em; text-shadow:0 1px 4px #000; }
.r05-center #storyStream { display:block; }
.r05-center .story-item .prose { font-size:15px; line-height:1.9; }

/* 人物证件 */
.cc-name { font-size:17px; font-weight:700; }
.cc-age { font-size:13px; color:var(--green); margin:2px 0 6px; }
.cc-region { font-size:12px; color:var(--muted); line-height:1.6; }
.cc-label { display:inline-block; margin-top:6px; font-size:11px; padding:1px 8px; border:1.5px solid var(--gold); color:#8a6a20; }

/* 人生格子摘要 */
.lg-summary { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.lg-title { font-weight:700; font-size:13px; }
.lg-count { font-size:12px; color:var(--muted); flex:1; }
.btn.sm { padding:4px 9px; font-size:12px; width:auto; box-shadow:none; }

/* 保障入口 */
.cov-status { font-size:12px; color:var(--muted); margin:0 0 8px; }

/* ---------- 抽屉（雷达 / 格子） ---------- */
.detail-overlay, .grid-overlay { position:fixed; inset:0; z-index:160; background:rgba(12,16,22,.62); display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow:auto; }
.detail-panel, .grid-panel { width:100%; max-width:920px; background:var(--paper); border:2px solid var(--ink); box-shadow:8px 8px 0 rgba(0,0,0,.3); margin:auto 0; }
.detail-header, .grid-header { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-bottom:2px solid var(--ink); background:#f0e7d3; }
.detail-header h3, .grid-header h3 { margin:0; font-size:16px; letter-spacing:.08em; }
.detail-body, .grid-body { padding:16px; }

/* ---------- 雷达 ---------- */
.radar-section { text-align:center; }
.radar-wrap { display:flex; justify-content:center; }
.radar-svg { width:100%; max-width:420px; height:auto; }
.radar-meta { font-size:12px; color:var(--muted); text-align:left; margin:0 0 8px; line-height:1.7; }
.radar-legend { display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; font-size:11.5px; color:var(--muted); margin:8px 0; }
.radar-legend span { display:inline-flex; align-items:center; gap:5px; }
.radar-legend .lg-dash { width:16px; border-top:2px dashed var(--green); display:inline-block; }
.radar-legend .lg-fill { width:14px; height:10px; background:rgba(224,169,79,.35); border:1.5px solid var(--gold); display:inline-block; }
.radar-legend .lg-warn { color:#b4543a; }
.radar-disclosure { font-size:11.5px; color:#7a7a68; line-height:1.7; text-align:left; margin:10px 0 0; padding:8px 10px; background:#f6f0e2; border-left:3px solid var(--gold); }
.radar-insufficient { padding:22px; border:2px dashed var(--gold); background:#fffaf0; text-align:left; }
.radar-insufficient p { margin:0 0 8px; }
.radar-status-list { margin:8px 0; padding-left:20px; font-size:13px; line-height:1.8; }
.radar-detail { width:100%; border-collapse:collapse; font-size:12px; margin:16px 0 8px; }

/* ===== revision-08 layers ===== */
/* =====================================================================
   revision-06 CSS — 在 rev05 布局基线上落实六条 UX 锁
   桌面三列 26:47:27；390 竖排；场景加高随事件变；格子默认可见；
   大白屏地名轮换开场（无小人）；身份卡带肖像；v10 上区。
   ===================================================================== */
:root { --ink:#1f2a24; --paper:#fffdf7; --r06paper:#EBF0ED; --r06card:#F7FAF8; --green:#2f6f52; --gold:#e0a94f; --line:#1f2a24; --muted:#5c6b5f; }

/* ---------- 锁1：大白屏地名轮换开场（无 traveler/companion） ---------- */
.screen.opening.r06-opening { position:fixed; inset:0; z-index:200; background:var(--r06paper); overflow:hidden; transition:opacity .38s ease; }
.r06-paper { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
.r06-paper::before { content:''; position:absolute; inset:0; opacity:.55;
  background-image:radial-gradient(circle at 1px 1px,#b9c9bd 1px,transparent 0); background-size:18px 18px; -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%); mask-image:linear-gradient(180deg,#000,transparent 70%); }
.r06-roll { position:relative; text-align:center; min-height:46vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.r06-country { position:relative; font-weight:800; letter-spacing:.02em; line-height:1.1; font-size:clamp(44px,9vw,110px); color:#16251d;
  transition:opacity .08s linear; }
.r06-country.settled { color:var(--green); }
.r06-meta { position:relative; margin:14px 0 0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:clamp(12px,2.6vw,16px); color:#5c7164; letter-spacing:.14em; }
.r06-open-foot { position:relative; margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:16px; }
.r06-ticket { display:inline-block; padding:5px 18px; border:2px solid var(--green); color:var(--green); letter-spacing:.08em; font-weight:700; font-size:12px; text-align:center; max-width:100%; white-space:normal; line-height:1.7; }
.r06-brand { display:inline-block; margin-top:2px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; letter-spacing:.16em; color:#7a8c7f; }
.r06-opening .opening-choices { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.r06-opening .btn { width:auto; min-width:130px; }
/* 旧 rev05 开场元素彻底禁用（防止残留 walker/星空） */
.opening-bg,.opening-stars,.opening-ground,.walker-stage,.walker,.opening-copy { display:none !important; }

/* ---------- 主体 / 本人表单（沿用 rev05） ---------- */

.gate-card { width:100%; max-width:620px; background:var(--r06card); border:2px solid var(--ink); box-shadow:6px 6px 0 rgba(0,0,0,.2); padding:clamp(18px,4vw,30px); }
.gate-card h2 { margin:0 0 6px; font-size:clamp(18px,4.6vw,24px); letter-spacing:.12em; }

.subject-options { display:grid; gap:12px; }
.subject-options .btn { text-align:left; }
.subject-options .btn small { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:3px; }

/* ===== revision-09 叙事增强层样式（第8–23项） ===== */

/* ======================= rev10-mobile：手机优先单栏（瘦顶栏 + 底部标签，仅此文件） ======================= */
/* 宽屏也只保留居中的 390–430px 一栏，两侧留浅底；内容区底部预留标签栏高度 */
.r05-shell, #r05Shell, #titleRoot, .wrap {

  margin-right: auto !important;
  padding-left: 0 !important;
  padding-right: 0 !important;
}
.r05-shell, #r05Shell {
  padding-top: 0 !important;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)) !important;
}
.r05-cols {
  display: block !important;
}
.r05-col.left, .r05-col.right { display: none !important; }

/* 1) 瘦顶栏：始终一行 44–52px，390px 宽绝不能折行；只显示「年龄 · 名字 · 地点」+ 菜单 */
.r05-top {
  position: sticky !important;
  top: 0 !important;
  z-index: 130 !important;
  display: flex !important;
  flex-wrap: nowrap !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 6px !important;
  height: 48px !important;
  min-height: 44px !important;
  max-height: 52px !important;

  margin-bottom: 8px !important;

}
.r05-top .tb-main {
  display: flex !important;
  flex-wrap: nowrap !important;
  gap: 5px !important;
  align-items: center !important;
  min-width: 0 !important;
  font-size: 12px !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
.r05-top .tb-main b { font-size: 13px !important; }
/* 顶栏只保留短状态：r05What / r05Subject 视觉隐藏，但 DOM/id 保留供 syncChrome 写入 */
.r05-top .tb-main .r10-hidden { display: none !important; }
.r05-top .tb-main .sep { color: #8a7f66; font-weight: 700; }
/* 旧按钮组整体移入菜单，顶栏不再出现「保险雷达」 */
.r05-top .tb-ctrl { display: none !important; }

/* 菜单溢出按钮与下拉：热区约 44px */
.r10-menu-btn {
  flex: 0 0 auto;
  min-width: 56px;
  height: 44px;
  padding: 0 10px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink);
  background: #e7dcc2;
  border: 2px solid var(--ink);
  border-radius: 8px;
  cursor: pointer;
}
.r10-menu {
  position: absolute !important;
  top: calc(100% + 4px) !important;
  right: 6px !important;
  z-index: 140 !important;
  min-width: 168px;
  padding: 6px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 10px;
  box-shadow: 0 10px 26px rgba(24,56,40,.22);
}
.r10-menu button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  font: inherit;
  font-size: 14px;

.r10-panel.is-active { display: block !important; }

.scene-banner {

.r05-col.center .scene-banner .scene-art {

/* rev11 第3项：取消叠在顶栏+场景上的高 sticky，改为情节下小卡 */

  right: 0 !important;

  font-size: 13px;

.r08-credit { margin-bottom: 8px !important; }


/* ===== rev11 第9项：同一张底图按人生时辰做明显光色变化（童年黎明 vs 晚年夜色） ===== */
.scene-art { overflow:hidden; }
.sj-topimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:filter .9s ease, object-position .9s ease; }
.sj-tint { position:absolute; inset:0; pointer-events:none; display:block; transition:background .9s ease; }
/* 童年 0–17：偏暖黎明，柔金暖橙 */
.sj-time-child .sj-topimg { filter: sepia(.28) saturate(1.18) brightness(1.08) hue-rotate(-6deg); object-position:50% 62%; }

  var EV28 = 'ev_hechengyi_28_checkup_or_interview';
  var EV33 = 'ev_hechengyi_33_thermos_callback';
  var CHOICE_IDS = ['c_accompany', 'c_interview', 'c_ask_aunt'];
  var CHOSE_FLAGS = ['chose_accompany_checkup', 'chose_go_interview', 'chose_ask_relative'];

  var EVENTS = {};

  /* ===== 运行态 ===== */
  var state;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function newState() {

      startAge: DRAFT.player.startAge,
      startMode: DRAFT.player.startMode,
      residence: clone(DRAFT.player.residence),
      flags: clone(DRAFT.narrative.flags),
      relations: clone(DRAFT.narrative.relations),
      history: [],
      phase: 'ev26',    // ev26 -> choose -> feedback -> ev33 -> done
      settled: false,
      lastChoiceId: null

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* choiceId -> flag 的唯一映射（仅这三个合法选择） */
  var CHOICE_FLAG = {
    'c_accompany': 'chose_accompany_checkup',
    'c_interview': 'chose_go_interview',
    'c_ask_aunt': 'chose_ask_relative'
  };

  /*
   * 有效的 28 岁选择历史：须同时满足
   *   1) eventId 为稳定的 EV28；
   *   2) choiceId 属于三个合法选择之一。
   * history 是“前史”的唯一证据，flag 残留不能替代记录。
   */
  function validChoiceEntry() {
    var found = null;
    state.history.forEach(function (h) {
      if (h && h.eventId === EV28 && CHOICE_IDS.indexOf(h.choiceId) !== -1) { found = h; }
    });
    return found;
  }

  /* unknownHistory = 没有上述有效记录；与 startMode、与残留 flag 都无关 */
  function lacksChoiceRecord() {
    return !validChoiceEntry();
  }

  /*
   * 三个 chose_* 的判定值：存在合法历史时以该历史的 choiceId 为权威，
   * 覆盖可能不一致的 flag；没有合法历史时一律视为未选择。
   */
  function choseFlagValue(name) {
    if (CHOSE_FLAGS.indexOf(name) === -1) { return state.flags[name] === true; }
    var entry = validChoiceEntry();
    if (!entry) { return false; }
    return CHOICE_FLAG[entry.choiceId] === name;
  }

  function whenMatches(when) {
    if (!when) return true;
    if (when.flags && !when.flags.every(function (f) { return choseFlagValue(f) === true; })) return false;
    if (when.noneOfFlags && !when.noneOfFlags.every(function (f) { return choseFlagValue(f) === false; })) return false;
    if (typeof when.unknownHistory === 'boolean' && when.unknownHistory !== lacksChoiceRecord()) return false;
    return true;
  }

  function resolveVariant(ev) {
    if (!ev.textVariants) return null;
    for (var i = 0; i < ev.textVariants.length; i++) {
      if (whenMatches(ev.textVariants[i].when)) return ev.textVariants[i];
    }
    return null;
  }

  function findChoice(id) {
    var list = EVENTS[EV28].choices;
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return null;
  }

  /* 三个 chose_* 互斥：先归零，只打开本选项声明的那个 */
  function applyChoice(choice) {
    var flags = (choice.effects && choice.effects.flags) || {};
    CHOSE_FLAGS.forEach(function (f) { state.flags[f] = false; });
    Object.keys(flags).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(state.flags, k)) {
        state.flags[k] = flags[k] === true;
      }
    });
  }

  function pushHistory(eventId, age, choiceId, consequence) {
    state.history.push({
      eventId: eventId,
      age: age,
      choiceId: choiceId,
      consequence: consequence
    });
  }

  /* ===== 流程 ===== */
  function advanceFrom26() {
    if (state.phase !== 'ev26') return;

    state.phase = 'choose';
    state.settled = false;
    render();

  function choose(choiceId) {

    if (!choice) return;
    state.settled = true;
    applyChoice(choice);
    state.lastChoiceId = choice.id;
    pushHistory(EV28, 28, choice.id, choice.immediateText);
    state.phase = 'feedback';
    render();
  }

    var ev = EVENTS[EV33];
    var variant = resolveVariant(ev);

    state.history = state.history.filter(function (h) { return h.eventId !== EV33; });

    state.phase = 'ev33';
    state.settled = true;
    pushHistory(EV33, 33, null, variant.recapText);
    render();

  function advanceFromFeedback() {
    if (state.phase !== 'feedback') return;
    enter33();

  function finish() {
    if (state.phase !== 'ev33') return;
    state.phase = 'done';
    render();

    state.phase = 'ev33';

  }

  function view33() {

      '<article class="card">' +
        '<div class="meta"><span class="chip solid">33 岁</span><span class="chip">回顾</span></div>' +
        '<p class="body">这一段先走到这里。上面记下的，是已经发生过的条目；没走过的路不写进记录。</p>' +
        '<button class="btn primary" type="button" data-act="reset">重开一局</button>' +
      '</article>';
  }

  function kindOf(eventId) {
    var ev = EVENTS[eventId];
    return ev ? ev.kind : '';
  }

  function renderLog() {
    if (!logList) return;
    if (!state.history.length) {
      logList.innerHTML = '<li class="empty"><span class="v">还没有发生过的事。</span></li>';
      return;
    }
    logList.innerHTML = state.history.map(function (h) {
      return '<li><span class="k">' + h.age + ' 岁 · ' + esc(kindOf(h.eventId)) + '</span>' +
             '<span class="v">' + esc(h.consequence) + '</span></li>';
    }).join('');
  }

  function render() {
    if (state.phase === 'ev26') { stage.innerHTML = view26(); }
    else if (state.phase === 'choose') { stage.innerHTML = viewChoose(); }
    else if (state.phase === 'feedback') { stage.innerHTML = viewFeedback(); }
    else if (state.phase === 'ev33') { stage.innerHTML = view33(); }
    else { stage.innerHTML = viewDone(); }
    if (ageLabel) { ageLabel.textContent = state.age + ' 岁'; }
    renderLog();
  }

  /* ===== 交互（事件委托） ===== */
  stage.addEventListener('click', function (ev) {
    var node = ev.target;
    var target = node && node.closest ? node.closest('[data-act],[data-choice]') : null;
    if (!target) return;
    var choiceId = target.getAttribute('data-choice');
    if (choiceId) { choose(choiceId); return; }
    var act = target.getAttribute('data-act');
    if (act === 'next26') { advanceFrom26(); }
    else if (act === 'next33') { advanceFromFeedback(); }
    else if (act === 'finish') { finish(); }
    else if (act === 'reset') { reset(); }
  });

  var btnReset = document.getElementById('btnReset');
  var btnJump = document.getElementById('btnJump');
  if (btnReset) { btnReset.addEventListener('click', reset); }
  if (btnJump) { btnJump.addEventListener('click', jumpTo33); }

  /* ===== 启动 ===== */
  state = newState();
  render();

  /* 自测钩子（不参与界面，仅供控制台/脚本核对状态） */
  window.__SJ = {
    state: function () { return state; },
    next26: advanceFrom26,
    choose: choose,
    next33: advanceFromFeedback,
    finish: finish,
    reset: reset,
    jump: jumpTo33,
    lacksChoiceRecord: function () { return lacksChoiceRecord(); },
    stageHTML: function () { return stage.innerHTML; },
    logHTML: function () { return logList ? logList.innerHTML : ''; }
  };
})();
</script>

<script id="shield-slice-calculationAndHelpers">  function flagsFromCosts(costIds){
    const flags = {};
    (costIds||[]).forEach(id => {
      const c = (cls().costs||[]).find(x => x.v===id);
      if(c && c.flag) flags[c.flag] = true;
    });
    return flags;
  }
  function familyFlags(a){
    const hasPartner = !!(a.partner && a.partner !== '单身');
    const kids = Number(a.kids==='4+'?4:a.kids)||0;
    const supportsParents = !!(a.parents && a.parents !== '没有' && a.parents !== '啃老');
    const mortgage = mortgageMap[a.mortgage] || 0;
    const family = !!(hasPartner || kids>0 || supportsParents);
    return {hasPartner, kids, supportsParents, mortgage, family};
  }

  function compute(answers, age, role, extraFlags){
    const a = answers || {};
    const f = familyFlags(a);
    const flags = Object.assign({}, extraFlags||{}, flagsFromCosts(a.costs));
    const income = Object.prototype.hasOwnProperty.call(incomeMap, a.income) ? incomeMap[a.income] : null;
    const spend = Object.prototype.hasOwnProperty.call(spendMap, a.spend) ? spendMap[a.spend] : null;
    const years = f.family ? 15 : 10;
    const educationGoal = f.kids>0 && Object.prototype.hasOwnProperty.call(educationMap, a.education);
    const educationFund = educationGoal ? f.kids * educationMap[a.education] : 0;
    const parentSupport = (supportMap[a.parents]||0)*12*years;
    let living = 0;
    if(f.family){
      if(income != null) living = (income*0.45)*years;
      else if(spend != null) living = spend*12*years;
    }
    const existing = Array.isArray(a.existing) ? a.existing.slice() : [];
    const unknownCover = existing.includes('都不清楚/暂时没有');
    const ex = unknownCover ? [] : existing;
    const existingLife = (!unknownCover && ex.includes('个人寿险') && income != null) ? income*2 : 0;
    const lifeGap = (!f.family && !f.mortgage) ? 0 : Math.max(0, f.mortgage + educationFund + living + parentSupport - existingLife);

    const history = Array.isArray(a.history) ? a.history : [];
    const heartOrCancer = history.includes('癌症') || history.includes('心脏病');
    const otherHistory = history.filter(h => h!=='癌症' && h!=='心脏病');
    const ciYears = 3;
    const ciBase = income != null ? income : (spend != null ? spend*12 : null);
    const ci = ciBase != null ? Math.max(500000, ciBase*ciYears) : null;
    const worries = (Array.isArray(a.worries) ? a.worries : []).filter(w => w!=='暂时没有取出');
    const accidentMult = !f.family ? 7 : 5;
    const accident = ciBase != null ? ciBase * accidentMult : null;
    const medical = 1200000;

    const mid = (state.exactAge != null && String(state.exactAge)!=='') ? Number(state.exactAge) : (AGE_MID[age] || 40);
    const exactUsed = state.exactAge != null && String(state.exactAge)!=='';
    let retirementAge = null;
    let retiredNow = false;
    if(a.workStatus === '已经主要靠储备走'){
      retirementAge = mid;
      retiredNow = true;
    } else if(a.retireAge != null && String(a.retireAge) !== ''){
      retirementAge = Number(a.retireAge);
      if(exactUsed && mid > retirementAge){
        retirementAge = mid;
      }
    }
    const lifespan = a.lifespan != null && String(a.lifespan)!=='' ? Number(a.lifespan) : null;
    const monthly = spend;
    let annuity = null;
    if(monthly != null && lifespan != null && retirementAge != null){
      annuity = Math.max(0, monthly*12*Math.max(0, lifespan - retirementAge));
    }
    const legacy = role==='传承大家长' || ['细水长流'].includes(a.legacyWish) || !!flags.legacy;
    const inflation = false;
    const reserveWorry = false;
    const savingsNeed = Math.min(95, (educationGoal?80:legacy?75:(flags.reserveThin?28:18)));

    const current = {
      medical: ex.includes('个人医疗/VHIS') && ex.includes('公司医疗') ? 80 : ex.includes('个人医疗/VHIS') ? 70 : ex.includes('公司医疗') ? 55 : 10,
      ci: ex.includes('个人重疾') ? 45 : 10,
      life: ex.includes('个人寿险') ? 45 : 10,
      accident: ex.includes('意外') ? 45 : 10,
      annuity: ex.includes('年金或储备') ? 40 : 10,
      savings: ex.includes('年金或储备') ? 40 : (educationGoal ? 8 : 10)
    };
    const targets = {
      medical: 85,
      ci: Math.min(95, 50 + ciYears*7 + (flags.healthStrain?5:0)),
      life: f.family || f.mortgage ? 88 : 40,
      accident: (worries.includes('意外') || !f.family || flags.careerRisk) ? 75 : 55,
      annuity: retirementAge!=null && lifespan!=null ? Math.min(95, 35+Math.max(0, lifespan-retirementAge)*1.5) : 50,
      savings: savingsNeed
    };

    const lifeWhy = (() => {
      if(!f.family && !f.mortgage) return '你目前没有需要抚养的家人，也没有按揭重负。寿险不是眼前必须补上的家庭责任缺口；若有想留下的心意，可按个人意愿另说。';
      const bits = [];
      if(f.mortgage) bits.push(`你还有${a.mortgage}这一档的按揭`);
      if(f.kids) bits.push(`有${f.kids===4?'4个或以上':f.kids+'个'}孩子`);
      if(f.hasPartner && !f.kids) bits.push('有同行的伴侣');
      if(f.supportsParents) bits.push('还在照看或支持长辈');
      return `因为${bits.join('，')}，可评估责任期内的家庭缺口。对照用盾表示，是今天的粗略示例。` + (educationGoal ? '其中教育安排可能与下面的教育储备对照重叠，不宜把两笔直接相加。' : '');
    })();

    const ciWhy = (() => {
      let s = ciBase != null ? `重疾保障常按${income!=null?'补给':'生活开销折年'}的 ${ciYears} 年作粗略对照。` : '你没有留下补给或生活开销，重疾需按个人情况另行估算，这里不编造一笔年薪。';
      if(heartOrCancer || otherHistory.length) s += '家族病史会留作进一步聊天和核保了解，不用来改这张得分图上的盾。';
      if((a.smoking==='吸烟'||a.smoking==='已戒烟')) s += '你提到有吸烟或戒烟史，同样需要进一步了解，本示例没有因此调整对照。';
      const cond = (a.conditions||[]).filter(x=>x!=='暂时没有');
      if(cond.length) s += `你目前还关注${cond.join('、')}，这只提醒需要进一步了解，没有用来提高对照。`;
      if(income==null && spend!=null && ciBase!=null) s += '由于没有工作补给，这里暂用生活开销折年作为对照基数，并已注明。';
      return s;
    })();

    const loc = a.location || state.location;
    const medWhy = `医疗费用会影响现金流。` + (loc==='香港' ? '你的落脚在港湾城，可先了解医疗或自愿医保（VHIS）。' : loc ? '你主要不在港湾城，这里用通用方式提及医疗保障类型。' : '') + (ex.includes('公司医疗')||ex.includes('个人医疗/VHIS') ? '你已经有一部分医疗装备，可在此基础上对照缺口。' : '');
    const accWhy = accident==null ? '意外保障的对照需要补给或生活开销作基数；你尚未提供时，这里只提醒通常需要考虑这一类型。' : `按${income!=null?'补给':'生活开销折年'}约 ${accidentMult} 年作示例对照。`;

    const annuityWhy = (() => {
      if(annuity==null) return '若要看养老现金流，需要生活开销和规划岁数。路上若已提供，会在这里给出粗略对照。';
      let s = `侧重放下行囊后或当前阶段的每月生活所需。按你盘点的每月开销、规划至 ${lifespan} 岁估算。`;
      if(retiredNow) s += exactUsed ? `你已经主要靠储备走路，起算年龄是你选定的 ${retirementAge} 岁。` : `你已经主要靠储备走路，起算年龄采用你所在年龄段的示意中点 ${retirementAge} 岁，不是精确年龄。`;
      else s += `起算年龄是你选择的 ${retirementAge} 岁，没有默认成 60 岁。`;
      s += '这是整个规划期的示例总缺口，并非每月领取金额。本示例未扣除强积金或其他已有储备，实际需要会更小。';
      if(ex.includes('年金或储备')) s += '你已勾选现有年金或储备，计算时应再减去真实已有安排。';
      if(flags.spendSticky) s += '你也承认生活开销不太容易往下压，所以这一项值得被看见。';
      return s;
    })();

    const savingsNotes = ['侧重逐步积攒一笔钱，按教育、传承或中期备用的实际用途梳理；不把储蓄写成投资。'];
    if(educationGoal) savingsNotes.push(`教育金：你有${f.kids===4?'4个或以上':f.kids+'个'}孩子，选择了${a.education}目标，对照约 ${grids(educationFund)}。它可能与上面寿险家庭责任里的教育部分重叠，不宜直接相加。`);
    if(legacy) savingsNotes.push('传承：你表达了相关职业、代价、担心或心愿，可进一步梳理受益安排与家庭意愿，按个人意愿评估。');
    if(!educationGoal && !legacy) savingsNotes.push('中期备用：先轻量梳理用途与可动用资金，暂不设目标盾数。');
    if(inflation) savingsNotes.push('对照以今天的水平表达；物价变化可能降低未来购买力，本演示未推算复利后的数字。');
    if(flags.reserveThin) savingsNotes.push('你在职业代价里承认长期或应急储备可能偏薄，所以把这一方向留下来对照。');

    const unitAmt = (n, fallback) => n!=null ? grids(n) : fallback;
    const items = [
      {type:'医疗/VHIS', key:'medical', icon:'🩺', amount: grids(medical), why:medWhy, code:'medical-vhis'},
      {type:'重疾', key:'ci', icon:'🛡', amount: ci!=null ? `${grids(ci)}–${Math.round(ci*1.5/10000)} 盾` : '按个人情况另行估算', why:ciWhy, code:'critical-illness'},
      {type:'寿险', key:'life', icon:'🏠', amount: (!f.family && !f.mortgage) ? '按个人意愿' : grids(lifeGap), why:lifeWhy, code:'life', hideAmount: !f.family && !f.mortgage},
      {type:'意外', key:'accident', icon:'🪨', amount: accident!=null ? grids(accident) : '按个人情况另行估算', why:accWhy, code:'accident'}
    ];
    const reserveItems = [
      {type:'年金', key:'annuity', icon:'🐉', purpose:'养老现金流', amount: annuity!=null ? grids(annuity) : '待补齐开销与规划岁数', why:annuityWhy, code:'annuity'},
      {type:'储蓄储备', key:'savings', icon:'🪙', purpose: educationGoal&&legacy?'教育与传承':educationGoal?'教育金':legacy?'传承':'中期备用', amount: educationGoal?`${grids(educationFund)}（教育对照）`:legacy?'按个人意愿评估':'先梳理用途', why:savingsNotes.join(''), code:'savings'}
    ];

    const budget = a.budget || '10%';
    let priority;
    if(budget==='5%'){
      priority = f.family || f.mortgage
        ? ['医疗/VHIS','意外','寿险','重疾','年金','储蓄储备']
        : ['医疗/VHIS','意外','重疾','寿险','年金','储蓄储备'];
    } else if(budget==='15%+'){
      priority = f.family || f.mortgage
        ? ['医疗/VHIS','寿险','年金','储蓄储备','重疾','意外']
        : ['医疗/VHIS','重疾','年金','储蓄储备','寿险','意外'];
    } else {
      priority = f.family || f.mortgage
        ? ['医疗/VHIS','寿险','重疾','意外','年金','储蓄储备']
        : ['医疗/VHIS','重疾','寿险','意外','年金','储蓄储备'];
    }
    const allItems = items.concat(reserveItems).sort((x,y)=>priority.indexOf(x.type)-priority.indexOf(y.type));
    const col = (SPAWN_OF[a.spawn]||SPAWN_OF[state.spawn]||{col:1}).col || 1;
    return {
      family:f.family, hasPartner:f.hasPartner, kids:f.kids, supportsParents:f.supportsParents, mortgage:f.mortgage,
      income, spend, monthly, retirementAge, lifespan, retiredNow, mid, exactUsed, ciYears, ciBase, lifeGap, educationGoal, educationFund,
      legacy, inflation, reserveWorry, flags, budget, existing:ex, unknownCover, history, otherHistory, heartOrCancer, worries,
      items:allItems, current, targets, role: role||'旅人',
      medicalNeed: medical,
      ciNeed: ci,
      lifeNeed: (!f.family && !f.mortgage) ? null : (f.mortgage + educationFund + living + parentSupport),
      existingLife, lifeGap,
      accidentNeed: accident,
      annuityNeed: annuity,
      savingsNeedAmt: educationGoal ? educationFund : null,
      reserve:{educationGoal, educationFund, legacy, inflation, reserveWorry},
      priority, col, receivedSupport: a.parents==='啃老'
    };
  }

  const DIMS = [['medical','医疗/VHIS'],['ci','重疾'],['life','寿险'],['accident','意外'],['annuity','年金'],['savings','储蓄储备']];
  const toGrids = (n) => {
    if(n==null || !isFinite(n)) return null;
    if(n<=0) return 0;
    return Math.max(1, Math.round(n/10000));
  };
  function equippedOf(c, key){
    const ex = c.existing||[];
    if(c.unknownCover) return false;
    if(key==='medical') return ex.includes('个人医疗/VHIS') || ex.includes('公司医疗');
    if(key==='ci') return ex.includes('个人重疾');
    if(key==='life') return ex.includes('个人寿险');
    if(key==='accident') return ex.includes('意外');
    if(key==='annuity' || key==='savings') return ex.includes('年金或储备');
    return false;
  }
  function gapText(n){
    if(n==null) return '';
    if(n>0) return '−'+n+' 盾';
    if(n<0) return '+'+(-n)+' 盾';
    return '齐平';
  }
  function defenceIndex(c){
    const lifeQuant = !!(c.family || c.mortgage);
    const lifeHaveAmt = (lifeQuant && equippedOf(c,'life') && (c.existingLife||0)>0) ? toGrids(c.existingLife) : null;
    const raw = {
      medical: {need: toGrids(c.medicalNeed), have: null},
      ci: {need: toGrids(c.ciNeed), have: null},
      life: {need: lifeQuant ? toGrids(c.lifeNeed) : null, have: lifeHaveAmt},
      accident: {need: toGrids(c.accidentNeed), have: null},
      annuity: {need: toGrids(c.annuityNeed), have: null},
      savings: {need: toGrids(c.savingsNeedAmt), have: null}
    };
    const dims=DIMS.map(([k,label])=>{
      const need=raw[k].need, have=raw[k].have, equipped=equippedOf(c,k);
      const quantifiedNeed=need!=null, quantifiedHave=have!=null;
      let gap=null, deltaLabel='', status='ok';
      if(quantifiedNeed && quantifiedHave){
        gap=need-have;
        const head = equipped ? '已装备 · 已对 '+have+' 盾，' : '已对 '+have+' 盾，';
        if(gap>0) deltaLabel=head+'还缺 '+gap+' 盾';
        else if(gap<0) deltaLabel=head+'多出 '+(-gap)+' 盾';
        else deltaLabel=head+'这面盾已齐平';
        status=gap>0?'neg':gap<0?'pos':'ok';
      } else if(quantifiedNeed && equipped){
        deltaLabel='已装备 · 待对盾';
      } else if(quantifiedNeed && !equipped){
        gap=need;
        deltaLabel=gapText(gap);
        status='neg';
      } else if(equipped){
        deltaLabel='已装备 · 待对盾';
      } else if(k==='life'){
        deltaLabel='按个人意愿';
      } else if(k==='savings'){
        deltaLabel='先梳理用途';
      } else {
        deltaLabel='另行估算';
      }
      const barNeed=quantifiedNeed?100:36;
      let barHave=0;
      if(quantifiedNeed && quantifiedHave) barHave=Math.min(100, Math.round(100*have/Math.max(need,1)));
      else if(equipped) barHave=52;
      return {key:k,label,need:need||0,have:have||0,needGrids:need,haveGrids:have,gap,quantifiedNeed,quantifiedHave,equipped,deltaLabel,status,barNeed,barHave};
    });
    let needTotal=0, haveTotal=0;
    const pendingEquipped=[];
    dims.forEach(d=>{
      const pending = !!(d.equipped && !d.quantifiedHave);
      if(d.quantifiedNeed && !pending) needTotal+=d.needGrids;
      if(d.quantifiedHave) haveTotal+=d.haveGrids;
      if(d.quantifiedNeed && pending) pendingEquipped.push({key:d.key,label:d.label,need:d.needGrids});
      else if(!d.quantifiedNeed && d.equipped) pendingEquipped.push({key:d.key,label:d.label,need:null});
    });
    const gapTotal=needTotal-haveTotal;
    let line=`按核心处境，参考需要 ${needTotal} 盾，已能量化的已有 ${haveTotal} 盾，还缺 ${Math.max(0,gapTotal)} 盾。只列出能换算成盾的对照，不是投保建议，也不是报价。`;
    if(pendingEquipped.length) line+=` 已装备、待按真实保额对盾：${pendingEquipped.map(x=>x.label).join('、')}，未计入上面的还缺总数。`;
    const order = c.priority || ['医疗/VHIS','重疾','寿险','意外','年金','储蓄储备'];
    const gaps = dims.filter(d=>d.quantifiedNeed && d.gap>0).sort((a,b)=>{
      const ia=order.indexOf(a.label), ib=order.indexOf(b.label);
      if(ia!==-1 && ib!==-1 && ia!==ib) return ia-ib;
      return (b.gap||0)-(a.gap||0);
    });
    return {needTotal,haveTotal,gapTotal,pendingEquipped,dims,line,score:null,tier:{icon:'',name:'护盾对照',line},gaps};
  }
</script>
<script id="shield-adapter">
/* =====================================================================
   盾公式接入适配层（本轮新增）。

(function () {

  var EXISTING_UNKNOWN = '都不清楚/暂时没有';
  var RECORD_KEYS = ['partner', 'kids', 'education', 'parents', 'mortgage', 'workStatus', 'income', 'spend', 'retireAge', 'lifespan', 'existing', 'budget', 'role'];

  var runtime = {
    submitted: false,
    answers: null,        /* 送入 compute 的 answers（白名单键，不含 role） */
    role: null,           /* 提交的角色；未选为 null */
    existingChoice: null, /* 'unknown' | 'none' | 'list' */
    result: null,         /* { computed, defence } */
    computedAtAge: null,

    statusText: '尚未计算',

  };

  function gs() { return SJ.state(); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];

  }
  function el(id) { return document.getElementById(id); }
  function val(id) { var e = el(id); return e ? String(e.value == null ? '' : e.value) : ''; }
  function checked(id) { var e = el(id); return !!(e && e.checked); }
  function setDisabled(id, dis) { var e = el(id); if (e) { e.disabled = !!dis; } }
  function clearValue(id) { var e = el(id); if (e) { e.value = ''; } }
  function uncheck(id) { var e = el(id); if (e) { e.checked = false; } }
  function clearExItems() {
    for (var i = 0; i < EXISTING_ITEMS.length; i++) { uncheck('ex_' + i); }
  }

  /* ---------- 静态骨架与表单 ---------- */
  function sel(id, label, opts, disabledFlag) {
    var o = ['<option value="">未选择</option>'];
    for (var i = 0; i < opts.length; i++) {
      o.push('<option value="' + esc(opts[i]) + '">' + esc(opts[i]) + '</option>');
    }
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
      '<select id="' + id + '"' + (disabledFlag ? ' disabled' : '') + '>' + o.join('') + '</select></div>';
  }

  function formHTML() {
    var h = [];
    h.push('<h2>保障输入（模拟演示表单）</h2>');
    h.push(sel('f_partner', '伴侣关系', PARTNER));
    h.push(sel('f_kids', '孩子数', KIDS));
    h.push('<div class="field"><label for="f_education">教育目标（仅孩子数大于 0 时可填）</label>' +
      '<select id="f_education" disabled><option value="">未选择</option>' +
      EDU.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('') +
      '</select></div>');
    h.push(sel('f_parents', '长辈供养（原规则港币示例分档；界面不提供「我支援」）', PARENTS));
    h.push(sel('f_mortgage', '按揭负债档', MORTGAGE));
    h.push(sel('f_work', '工作状态', WORK));
    h.push('<div class="field"><label for="f_income">年收入档（仅「还在工作」可填；原规则港币示例）</label>' +
      '<select id="f_income" disabled><option value="">未选择</option>' +
      INCOME.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('') +
      '</select></div>');
    h.push(sel('f_spend', '每月生活开销（原规则港币示例分档）', SPEND));
    h.push('<div class="field"><label for="f_retire">规划退休年龄（仅「还在工作」可填）</label>' +
      '<select id="f_retire" disabled><option value="">未选择</option>' +
      RETIRE.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('') +
      '</select></div>');
    h.push(sel('f_life', '规划寿命', LIFESPAN));

    var items = EXISTING_ITEMS.map(function (it, i) {
      return '<label><input type="checkbox" id="ex_' + i + '" class="exItem"> ' + esc(it) + '</label>';
    }).join('');
    h.push('<div class="field"><label>已有安排（可多选；或在下面两项中明确二选一，互斥）</label>' +
      '<div class="exRow">' + items + '</div>' +
      '<div class="exRow sub">' +
      '<label><input type="checkbox" id="f_ex_unknown"> ' + esc(EXISTING_UNKNOWN) + '（与其余互斥）</label>' +
      '<label><input type="checkbox" id="f_ex_none"> 明确未选择任何项（与其余互斥）</label>' +
      '</div></div>');

    h.push(sel('f_budget', '预算档（可不选；函数缺省回退 10%）', BUDGET));
    h.push(sel('f_role', '角色（可不选；函数会输出「旅人」，内部类别回退「自由探险家」）', ROLE_OPTIONS));

    h.push('<button class="btn primary" type="button" data-act="covSubmit">提交并计算对照</button>');
    return h.join('');
  }

  function renderShell() {
    covRoot.innerHTML =
      '<h2>保障对照（模拟演示）</h2>' +
      '<p class="note"><strong>这是教育样段里的保障对照，不是投保建议、报价或适购结论。</strong>' +
      '金额按原规则港币（HK$）示例分档；内地/海外口径未定，未做换汇。</p>' +
      '<div id="covStatus"></div>' +
      '<div id="covForm">' + formHTML() + '</div>' +
      '<p class="err" id="covErr"></p>' +
      '<p class="hint">未选的项不送入计算；故事不因未填保障而阻塞，「继续」等叙事按钮不受影响。重开一局会清空本区填写与结果；跳龄会按新年龄重算已提交的结果。</p>';
  }

  /* ---------- 结果区 ---------- */
  function resultHTML() {
    var d = runtime.result.defence;
    var c = runtime.result.computed;
    var s = gs();
    var out = [];

    out.push('<div class="cov-line">' + esc(d.line) + '</div>');
    out.push('<ul class="totals">' +
      '<li>参考需要（needTotal）：' + d.needTotal + ' 盾</li>' +
      '<li>已能量化的已有（haveTotal）：' + d.haveTotal + ' 盾</li>' +
      '<li>还缺（gapTotal）：' + Math.max(0, d.gapTotal) + ' 盾</li></ul>');
    var pe = (d.pendingEquipped || []).map(function (x) { return esc(x.label); }).join('、');
    out.push('<p class="note">已装备、待按真实保额对盾（pendingEquipped，未计入上面的还缺总数）：' + (pe || '无') + '。</p>');
    out.push('<p class="note">「还缺」＝参考需要−已能量化的已有；已装备但未量化的项已从总需盾剔除，因此它不是「所有保障的实际缺口」。单位是盾（score 为 null，不采用百分制）。current/targets 不是盾数，此处不展示。</p>');

    var rows = d.dims.map(function (x) {
      return '<tr><th>' + esc(x.label) + '</th><td>' + (x.quantifiedNeed ? x.needGrids + ' 盾' : '未量化') + '</td><td>' + esc(x.deltaLabel) + '</td></tr>';
    }).join('');
    out.push('<table><thead><tr><th>类别</th><th>参考需要</th><th>对照说明</th></tr></thead><tbody>' + rows + '</tbody></table>');

    var notes = [];
    notes.push('按运行态年龄 ' + runtime.computedAtAge + ' 岁计算（年龄段 ' + bandFromAge(runtime.computedAtAge) + '），未使用开局快照年龄。');

    if (c.unknownCover) {
      notes.push('已有点选「都不清楚/暂时没有」：无已确认装备、待对盾为空；它与「明确未选择任何项」是不同的提交，未混同。');
    } else if (runtime.existingChoice === 'none') {
      notes.push('你明确未选择任何已有安排：无可量化的已有装备；与「都不清楚/暂时没有」分开记录，未自动改写。');
    }

    notes.push('家族病史、现病、吸烟、担忧、传承心愿本轮未采集，未参与计算，也未从剧情（history、亲属、陪诊/面试/保温杯 flag、性别、姓名）推断。');
    var missing = RECORD_KEYS.filter(function (k) { return !(k in (runtime.recorded || {})); });
    if (missing.length) { notes.push('未采集：' + esc(missing.join('、')) + '；对应项按原函数缺省处理，不代表已确认。'); }

  /* ---------- 采集（白名单键，未选不送） ---------- */
  function collect() {
    var a = {};
    var partner = val('f_partner'); if (partner) { a.partner = partner; }
    var kids = val('f_kids'); if (kids) { a.kids = kids; }
    if (kids === '1' || kids === '2' || kids === '3' || kids === '4+') {
      var edu = val('f_education'); if (edu) { a.education = edu; }
    }
    var parents = val('f_parents'); if (parents) { a.parents = parents; }
    var mortgage = val('f_mortgage'); if (mortgage) { a.mortgage = mortgage; }
    var work = val('f_work');
    if (work) {
      a.workStatus = work;
      if (work === '还在工作') {
        var income = val('f_income'); if (income) { a.income = income; }
        var retire = val('f_retire'); if (retire) { a.retireAge = retire; }
      }
      /* 「已经主要靠储备走」时不残留已填 income/retireAge */
    }
    var spend = val('f_spend'); if (spend) { a.spend = spend; }
    var life = val('f_life'); if (life) { a.lifespan = life; }

    var unknown = checked('f_ex_unknown');
    var none = checked('f_ex_none');
    var items = [];
    for (var i = 0; i < EXISTING_ITEMS.length; i++) { if (checked('ex_' + i)) { items.push(EXISTING_ITEMS[i]); } }
    if ((unknown && none) || ((unknown || none) && items.length)) {
      return { error: '已有安排选择矛盾：请只选择具体装备、都不清楚/暂时没有、明确未选择其中一种。' };
    }
    var choice;
    if (unknown) { a.existing = [EXISTING_UNKNOWN]; choice = 'unknown'; }
    else if (none) { a.existing = []; choice = 'none'; }
    else if (items.length) { a.existing = items; choice = 'list'; }
    else { return { error: '已有安排：请选择具体装备、都不清楚/暂时没有，或明确未选择任何项之一。' }; }

    var budget = val('f_budget'); if (budget) { a.budget = budget; }
    a.costs = []; /* 本轮不采集角色代价 */
    return { answers: a, choice: choice, role: val('f_role') };
  }

  function missingRequired(c) {
    var a = (c && c.answers) || {};
    var missing = [];
    var fields = [
      ['partner', '伴侣关系', PARTNER], ['kids', '孩子数', KIDS],
      ['parents', '长辈供养', PARENTS], ['mortgage', '按揭负债档', MORTGAGE],
      ['workStatus', '工作状态', WORK], ['spend', '每月生活开销', SPEND],
      ['lifespan', '规划寿命', LIFESPAN]
    ];
    fields.forEach(function (f) {
      if (f[2].indexOf(a[f[0]]) === -1) { missing.push(f[1]); }
    });
    if (a.kids && a.kids !== '0' && EDU.indexOf(a.education) === -1) { missing.push('教育目标'); }
    if (a.workStatus === '还在工作') {
      if (INCOME.indexOf(a.income) === -1) { missing.push('年收入档'); }
      if (RETIRE.indexOf(a.retireAge) === -1) { missing.push('规划退休年龄'); }
    }
    return missing;
  }

  function clearSubmittedData() {
    runtime.submitted = false;
    runtime.answers = null;
    runtime.role = null;
    runtime.existingChoice = null;
    runtime.result = null;
    runtime.computedAtAge = null;
    runtime.recorded = null;
    runtime.error = '';
    runtime.issues = [];
    var s = gs();
    if (s) { s.coverageInputs = { mappingStatus: 'incomplete' }; }
  }

  function blockSubmission(issues) {
    clearSubmittedData();
    runtime.statusText = '资料未齐，尚未计算';
    runtime.issues = issues || [];
    renderStatus();
    return { error: runtime.issues.join('；') || runtime.statusText };
  }

  function invalidateAfterChange(msg) {
    if (!runtime.submitted && !runtime.result) { return; }
    clearSubmittedData();
    runtime.statusText = (msg && msg.statusText) || '资料已更改，尚未计算';
    runtime.issues = (msg && msg.issues) || ['请重新提交后计算；旧结果已清除。'];
    renderStatus();
  }

  /* ---------- 计算（构造原闭包所需 state，role 双向同步） ---------- */
  function computeNow() {
    var c = collect();
    if (c.error) { return blockSubmission([c.error]); }
    var missing = missingRequired(c);
    if (missing.length) { return blockSubmission(missing); }
    var s = gs();
    var location = LOC_MAP[s && s.residence && s.residence.region] || null;
    var roleParam = c.role || undefined;
    var prev = { exactAge: state.exactAge, role: state.role, location: state.location, spawn: state.spawn };
    try {
      state.exactAge = s.age;        /* 运行态年龄，非开局快照 */
      state.role = roleParam;        /* 与 compute 参数 role 同步（cls() 读闭包） */
      state.location = location;     /* 仅来自 residence.region */
      state.spawn = null;            /* 出生点未采集，不强配 */
      var comp = compute(c.answers, bandFromAge(s.age), roleParam, {});
      var def = defenceIndex(comp);
    } finally {
      state.exactAge = prev.exactAge; state.role = prev.role;
      state.location = prev.location; state.spawn = prev.spawn;
    }
    runtime.submitted = true;
    runtime.answers = c.answers;
    runtime.role = c.role || null;
    runtime.existingChoice = c.choice;
    runtime.result = { computed: comp, defence: def };
    runtime.computedAtAge = s.age;
    var rec = JSON.parse(JSON.stringify(c.answers));
    rec.role = c.role || null;
    runtime.recorded = rec;
    runtime.error = '';
    runtime.statusText = '尚未计算';
    runtime.issues = [];
    s.coverageInputs = { mappingStatus: 'submitted', answers: JSON.parse(JSON.stringify(rec)), computedAtAge: s.age };
    renderStatus();
    return {};
  }

  function resetRuntime() {
    runtime.submitted = false;
    runtime.answers = null;
    runtime.role = null;
    runtime.existingChoice = null;
    runtime.result = null;
    runtime.computedAtAge = null;
    runtime.recorded = null;
    runtime.error = '';
    runtime.statusText = '尚未计算';
    runtime.issues = [];
    var s = gs();
    if (s) { s.coverageInputs = { mappingStatus: 'incomplete' }; }
    renderShell();
    renderStatus();
  }

  /* ---------- 交互 ---------- */
  covRoot.addEventListener('change', function (ev) {
    var t = ev && ev.target;
    var id = t && t.id;
    if (id === 'f_kids') {
      var kids = val('f_kids');
      var hasKids = kids === '1' || kids === '2' || kids === '3' || kids === '4+';
      setDisabled('f_education', !hasKids);
      if (!hasKids) { clearValue('f_education'); }
    } else if (id === 'f_work') {
      var working = val('f_work') === '还在工作';
      setDisabled('f_income', !working);
      setDisabled('f_retire', !working);
      if (!working) { clearValue('f_income'); clearValue('f_retire'); }
    } else if (id === 'f_ex_unknown' && checked('f_ex_unknown')) {
      clearExItems(); uncheck('f_ex_none');
    } else if (id === 'f_ex_none' && checked('f_ex_none')) {
      clearExItems(); uncheck('f_ex_unknown');
    } else if (/^ex_[0-9]+$/.test(id || '') && checked(id)) {
      uncheck('f_ex_unknown');
      uncheck('f_ex_none');
    }
    invalidateAfterChange();
  });

  covRoot.addEventListener('click', function (ev) {
    var t = ev && ev.target && ev.target.closest ? ev.target.closest('[data-act="covSubmit"],[data-act="covRecompute"]') : null;
    if (!t) { return; }
    computeNow();
  });

  /* 重开/跳龄/推进后的保障态处理：包装 __SJ 钩子 + 追加按钮监听（不改游戏内部逻辑） */
  var origReset = SJ.reset;
  var origJump = SJ.jump;
  var origNext26 = SJ.next26;
  var origNext33 = SJ.next33;
  SJ.reset = function () { origReset(); resetRuntime(); };
  SJ.jump = function () { origJump(); if (runtime.submitted) { computeNow(); } };
  SJ.next26 = function () { origNext26(); if (runtime.submitted) { renderStatus(); } };
  SJ.next33 = function () { origNext33(); if (runtime.submitted) { renderStatus(); } };

  var btnReset = document.getElementById('btnReset');
  var btnJump = document.getElementById('btnJump');
  var stageEl = document.getElementById('stage');
  if (btnReset) { btnReset.addEventListener('click', function () { resetRuntime(); }); }
  if (btnJump) { btnJump.addEventListener('click', function () { if (runtime.submitted) { computeNow(); } }); }
  if (stageEl) {
    stageEl.addEventListener('click', function (ev) {
      var t = ev && ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!t) { return; }
      var act = t.getAttribute('data-act');
      if (act === 'reset') { resetRuntime(); }
      else if ((act === 'next26' || act === 'next33') && runtime.submitted) { renderStatus(); }
    });
  }

  /* ---------- __SJ 扩展（不破坏原有钩子） ---------- */
  SJ.computeFixture = function (fixture) {
    var amb = (fixture && fixture.ambientState) || {};
    var prev = { exactAge: state.exactAge, role: state.role, location: state.location, spawn: state.spawn };
    try {
      state.exactAge = (amb.exactAge == null) ? null : amb.exactAge;
      state.role = (amb.role == null) ? null : amb.role;
      state.location = (amb.location == null) ? null : amb.location;
      state.spawn = (amb.spawn == null) ? null : amb.spawn;
      var comp = compute(fixture.answers, fixture.ageBand, fixture.role, fixture.extraFlags || {});
      var def = defenceIndex(comp);
      return { computed: comp, defence: def };
    } finally {
      state.exactAge = prev.exactAge; state.role = prev.role;
      state.location = prev.location; state.spawn = prev.spawn;
    }
  };
  SJ.covComputeNow = function () { return computeNow(); };
  SJ.covRuntime = function () { return runtime; };
  SJ.covInvalidate = function (msg) { invalidateAfterChange(msg); };

  /* ---------- 启动 ---------- */
  (function init() {
    var s = gs();
    if (s && !s.coverageInputs) { s.coverageInputs = { mappingStatus: 'incomplete' }; }
    renderShell();
    renderStatus();
  })();
})();
</script>
