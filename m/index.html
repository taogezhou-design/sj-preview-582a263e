      '<p class="hint">跳龄只改变起点：被跳过的阶段不会补写选择、子女或父母存亡；依赖前史的事件会走中性分支。</p></article>');
    return out.join('');
  }

  /* ====================== 段落：已发生的普通叙事为连贯段落，只突出当前待选/终点 ====================== */
  function scrollToLatest(smooth) {
    var t = storyStream.lastElementChild;
    if (t) {
      if (smooth === false) { t.scrollIntoView({ block: 'start' }); }
      else { try { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { t.scrollIntoView({ block: 'start' }); } }
    }
  }
  /* 追加一段普通正文（无边框、无逐卡标签）；先把旧高亮下沉为正文，保持只突出当前 */
  function appendFlow(textHtml) {
    demoteFocus();
    var div = document.createElement('div');
    div.className = 'story-item flow';
    div.innerHTML = '<p class="prose">' + (textHtml || '') + '</p>';
    storyStream.appendChild(div);
    if (FLOW.autoFollow) scrollToLatest(true);
    return div;
  }
  /* 把当前高亮下沉为普通段落（保留正文，去掉边框/标签/按钮） */
  function demoteFocus() {
    if (!focusEl) return;
    var p = focusEl.querySelector('p.body');
    var text = p ? p.innerHTML : '';
    var flow = document.createElement('div');
    flow.className = 'story-item flow';
    flow.innerHTML = '<p class="prose">' + text + '</p>';
    if (focusEl.parentNode) focusEl.parentNode.replaceChild(flow, focusEl);
    focusEl = null;
  }
  /* 追加高亮卡片（当前待选/终点）：先下沉旧高亮，再追加 */
  function appendFocus(innerHtml) {
    demoteFocus();
    var div = document.createElement('div');
    div.className = 'story-item focus';
    div.innerHTML = innerHtml;
    storyStream.appendChild(div);
    focusEl = div;
    if (FLOW.autoFollow) scrollToLatest(true);
    return div;
  }

  function cardFor(text, metaChips, extra) {
    return '<article class="card"><div class="meta">' + (metaChips || '') + '</div>' +
      '<p class="body">' + (text || '') + '</p>' + (extra || '') + '</article>';
  }
  function choiceButtons(choices) {
    return choices.map(function (c) {
      return '<button class="btn" type="button" data-flow-choice="' + esc(c.id) + '">' + esc(c.label) + '</button>';
    }).join('') + '<p class="hint">两条路都有代价，没有更高更低；选一次就结算一次。</p>';
  }

  /* ====================== 演示路径（文案从底本 stageHTML 读取，不复制） ====================== */
  function bodyFromStage() {
    var html = baseStageHTML();
    var m = html.match(/<p class="body">([\s\S]*?)<\/p>/);
    return m ? m[1] : '';
  }
  function choicesFromStage() {
    var html = baseStageHTML();
    var out = [], re = /<button[^>]*data-choice="([^"]+)"[^>]*>([\s\S]*?)<\/button>/g, m;
    while ((m = re.exec(html))) { out.push({ id: m[1], label: m[2] }); }
    return out;
  }

  /* reflectDemo：按底本当前 phase 追加对应片段；待选/终点用高亮卡片，其余为正文段落 */
  function reflectDemo() {
    var ph = baseState().phase;
    if (ph === 'ev26') {
      appendFlow(bodyFromStage());
      FLOW.hardPaused = false;
    } else if (ph === 'choose') {
      appendFocus(cardFor(bodyFromStage(), chip('28 岁', true) + chip('抉择'), choiceButtons(choicesFromStage())));
      FLOW.hardPaused = true;
    } else if (ph === 'feedback') {
      appendFlow(bodyFromStage());
      FLOW.hardPaused = false;
    } else if (ph === 'ev33') {
      appendFlow(bodyFromStage());
      FLOW.hardPaused = false;
    } else if (ph === 'done') {
      appendFocus(cardFor(bodyFromStage(), chip('收束', true) + chip('回顾'),
        '<button class="btn primary" type="button" data-flow-act="restartDemo">重开一局</button>' +
        '<button class="btn ghost" type="button" data-flow-act="toTitle">回到开头</button>'));
      FLOW.ended = true; FLOW.hardPaused = true;
    }
    syncChrome();
  }

  /* 自动播放入口（含可读延时调度） */
  function demoEnterDirect() { newRun(); clearStream(); baseReset(); reflectDemo(); }
  function demoEnter() { demoEnterDirect(); scheduleNext(readableDelay(stripTags(bodyFromStage())), demoAdvanceFrom26); }
  function demoAdvanceFrom26() { baseNext26(); reflectDemo(); /* 待选，不调度 */ }
  function demoChoose(id) {
    if (!FLOW.hardPaused || FLOW.ended) return false;
    if (baseState().phase !== 'choose' || baseState().settled) return false;
    baseChoose(id);               /* → feedback；只结算一次（底本 settled 守护） */
    reflectDemo();                /* 旧选择下沉为正文 + 反馈正文 */
    scheduleNext(readableDelay(stripTags(bodyFromStage())), demoAdvanceFromFeedback);
    return true;
  }
  function demoAdvanceFromFeedback() { baseNext33(); reflectDemo(); scheduleNext(readableDelay(stripTags(bodyFromStage())), demoFinish); }
  function demoFinish() { baseFinish(); reflectDemo(); /* 终局，不调度 */ }
  function demoJumpDirect() { newRun(); clearStream(); baseJump(); reflectDemo(); }
  function demoJump() { demoJumpDirect(); scheduleNext(readableDelay(stripTags(bodyFromStage())), demoFinish); }

  /* ====================== 自选人生路径 ====================== */
  function startCustom(player) {
    var p = player || readPlayerForm();
    if (p && p.error) { showTitleError(p.error); return { error: p.error }; }
    newRun();
    LIFE.state = newLifeState(p);
    LIFE.active = true;
    if (typeof baseReset === 'function') { baseReset(); }   /* 清演示态与保障运行态 */
    LIFE.state.coverageInputs = { mappingStatus: 'incomplete' };
    setMode('custom');
    clearStream();
    syncChrome();
    drive();
    return {};
  }
  function currentStep() { var S = LIFE.state; if (!S || S.idx >= S.queue.length) return null; return S.queue[S.idx]; }
  function commitEvent(ev) {
    var S = LIFE.state, v = variantOf(ev);
    if (ev.sets) Object.keys(ev.sets).forEach(function (k) { S.flags[k] = true; });
    if (v.sets) Object.keys(v.sets).forEach(function (k) { S.flags[k] = true; });
    S.history.push({ eventId: ev.id, age: ev.age, choiceId: null, consequence: v.recap });
    S.age = ev.age; S.idx += 1; S.settled = false; S.phase = 'event';
    covSyncAge();
    return v;
  }
  function commitChoice(ev, choice, v) {
    var S = LIFE.state; if (S.settled) return false;
    S.settled = true;
    if (choice.flags) Object.keys(choice.flags).forEach(function (k) { S.flags[k] = true; });
    var rb = (v && v.recapBy) || ev.recapBy;
    S.history.push({ eventId: ev.id, age: ev.age, choiceId: choice.id,
      consequence: (rb && rb[choice.id]) || choice.immediate });
    S.age = ev.age; S.idx += 1; S.settled = false; S.phase = 'event';
    covSyncAge();
    return true;
  }
  function drive() {
    if (FLOW.busy) return; var S = LIFE.state; if (!S) return;
    var step = currentStep();
    if (!step) { lifeEnding(); return; }
    if (step.type === 'quiet') {
      var txt = quietText(step.from, step.to);
      S.age = step.to; S.idx += 1;
      appendFlow(esc(txt));
      syncChrome();
      covSyncAge();
      scheduleNext(readableDelay(txt), drive);
    } else if (step.type === 'end') {
      lifeEnding();
    } else { /* event */
      var ev = step.ev;
      if (ev.choices) {
        /* rev11 第3项：先把刚发生的情节写成普通正文，停一拍再在正文下方出小选择卡 */
        var v = variantOf(ev);
        S.age = ev.age; S.phase = 'choose';
        covSyncAge();
        var storyNode = appendFlow(esc(v.text));
        FLOW.hardPaused = true;
        syncChrome();
        showChoiceCardAfter(storyNode, v.choices, 900 + Math.random() * 500);
      } else {
        var vv = commitEvent(ev);
        appendFlow(esc(vv.text));
        syncChrome();
        scheduleNext(keyDelay(stripTags(vv.text), ev.id), drive);
      }
    }
  }
  function lifeChoose(id) {
    if (!FLOW.hardPaused || FLOW.ended || !LIFE.active) return false;
    var S = LIFE.state; var step = currentStep();
    if (!step || step.type !== 'event' || !step.ev.choices) return false;
    var v = variantOf(step.ev);                       /* rev11 第2项：用分支后的 choices */
    var choices = v.choices || step.ev.choices;
    for (var i = 0; i < choices.length; i++) {
      if (choices[i].id === id) {
        var settled = commitChoice(step.ev, choices[i], v);
        if (!settled) return false;
        FLOW.hardPaused = false;
        demoteFocus();   /* 旧选择提示下沉为正文 */
        var stream = document.getElementById('storyStream');   /* rev12 修复：此作用域无 el()，原写法点选后报错卡住 */
        if (stream) {
          var bs = stream.querySelectorAll('.r09-choice-mini button[data-flow-choice]');
          for (var b = 0; b < bs.length; b++) { bs[b].disabled = true; bs[b].classList.add('chosen'); }
        }
        appendFlow(esc(choices[i].immediate));        /* 反馈为正文 */
        syncChrome();
        scheduleNext(keyDelay(stripTags(choices[i].immediate), step.ev.id), drive);
        return true;
      }
    }
    return false;
  }
  function lifeEnding() {
    var S = LIFE.state;
    FLOW.ended = true; FLOW.hardPaused = true; clearTimer(); FLOW.minUntil = 0;
    S.phase = 'ended';
    var text = '八十四岁，这一段落在这里。你回头看，能想起来的往往不是大事，是某几年的热水、某几天的太阳，和几次没有第二条路的选择。' +
      '这段人生到此暂停——它是虚构的模拟，不是对你寿命的预测，也不是任何保障或产品的建议。';
    var about = '<p class="note">本局：' + esc(S.name) + '，' + esc(regionLabel(S.birthplace.region)) + '出生，现居' + esc(regionLabel(S.residence.region)) +
      '，' + (S.startMode === 'jump-to-age' ? ('从 ' + S.startAge + ' 岁跳入（此前无记录）') : '从出生开始') + '。</p>';
    appendFocus('<article class="card"><div class="meta">' + chip('收束', true) + chip('虚构模拟') + '</div>' +
      '<p class="body">' + esc(text) + '</p>' + about +
      '<button class="btn primary" type="button" data-flow-act="restartLife">再走一次（同一设定）</button>' +
      '<button class="btn ghost" type="button" data-flow-act="toTitle">回到开头</button></article>');
    syncChrome();
  }

  /* ====================== 保障同步（fix02：保险不可见，no-op） ====================== */
  function covSyncAge() { /* fix02：保险采集表/计算入口/盾数结果已从所有可见路径移除，不再同步/失效 */ }

  /* ====================== 同步侧栏 / 头部 ====================== */
  function stripTags(s) { return String(s || '').replace(/<[^>]+>/g, ''); }
  function journalHTML() {
    var S = LIFE.state;
    if (!S || !S.history.length) return '<li class="empty"><span class="v">还没有发生过的事。</span></li>';
    return S.history.map(function (h) {
      return '<li><span class="k">' + h.age + ' 岁</span><span class="v">' + esc(h.consequence) + '</span></li>';
    }).join('');
  }
  function syncChrome() {
    var age = '—';
    if (MODE === 'demo') { var ds = baseState(); if (ds && typeof ds.age === 'number') age = ds.age + ' 岁'; }
    else if (MODE === 'custom' && LIFE.state) { age = LIFE.state.age + ' 岁'; }
    if (ageLabelEl) ageLabelEl.textContent = age;
    if (headerWho) headerWho.textContent = (MODE === 'demo') ? '何澄意' : (MODE === 'custom' && LIFE.state) ? LIFE.state.name : '—';
    if (headerWhat) headerWhat.textContent = (MODE === 'demo') ? '三事件样段' : (MODE === 'custom') ? '自选人生' : '开局';
    if (MODE === 'custom' && logList) { logList.innerHTML = journalHTML(); }
    if (covStatusEl) {
      /* fix02：covStatusEl 改显人物状态，不再显示保障计算状态 */
      var st = '状态：';
      if (MODE === 'demo') { st += '何澄意，' + age; }
      else if (MODE === 'custom' && LIFE.state) { st += LIFE.state.name + '，' + age + (LIFE.state.phase === 'ended' ? '，已收束' : ''); }
      else { st += '—'; }
      covStatusEl.textContent = st;
    }
    if (flowDock) flowDock.setAttribute('data-state', FLOW.ended ? 'ended' : (FLOW.hardPaused ? 'choice' : (FLOW.userPaused ? 'paused' : 'playing')));
    var resumeBtn = flowDock ? flowDock.querySelector('[data-flow-act="resume"]') : null;
    if (resumeBtn) { resumeBtn.disabled = FLOW.hardPaused || FLOW.ended; }
  }

  /* ====================== 模式 / 重置 / 跳龄 ====================== */
  function setMode(next) {
    MODE = next;
    document.body.className = 'mode-' + next;
    if (titleRoot) titleRoot.style.display = (next === 'title') ? 'block' : 'none';
    if (storyStream) storyStream.style.display = (next === 'title') ? 'none' : 'block';
    if (flowDock) flowDock.style.display = (next === 'title') ? 'none' : 'flex';
    syncChrome();
  }
  function clearStream() { if (storyStream) storyStream.innerHTML = ''; FLOW.autoFollow = true; focusEl = null; }

  function enterDemo() {
    if (MODE === 'demo' && !FLOW.ended) return;
    LIFE.active = false; LIFE.state = null;
    setMode('demo');
    demoEnter();
  }
  function resetToTitle() {
    newRun();
    LIFE.active = false; LIFE.state = null;
    if (typeof baseReset === 'function') baseReset();
    setMode('title');
    if (titleRoot) titleRoot.innerHTML = titleHTML();
    clearStream();
    if (logList) logList.innerHTML = '<li class="empty"><span class="v">还没有发生过的事。</span></li>';
    syncChrome();
  }
  function restartCurrent() {
    if (MODE === 'demo') { demoEnter(); return; }
    if (MODE === 'custom' && LIFE.state) { var p = LIFE.state.player; startCustom(p); }
  }

  function readPlayerForm() {
    function v(id) { var e = document.getElementById(id); return e ? String(e.value == null ? '' : e.value).trim() : ''; }
    var gender = v('t_gender'), br = v('t_birth_region'), rr = v('t_res_region');
    var mode = v('t_mode') || 'from-birth', ageRaw = v('t_age'), errs = [];
    if (!gender) errs.push('请选择性别');
    if (!br) errs.push('请选择出生地地域');
    if (!rr) errs.push('请选择现居地地域');
    var startAge = 0;
    if (mode === 'jump-to-age') { var n = Number(ageRaw); if (!isFinite(n) || n < 0 || n > 79) errs.push('跳龄请填 0–79 之间的整数'); startAge = Math.round(n); }
    if (errs.length) return { error: errs.join('；') };
    return { name: v('t_name') || '旅人', gender: gender,
      birthplace: { region: br, place: v('t_birth_place') || '' },
      residence: { region: rr, place: v('t_res_place') || '' },
      startMode: mode, startAge: startAge };
  }
  function showTitleError(msg) { var e = document.getElementById('tErr'); if (e) e.textContent = msg; }

  /* ====================== 保障面板折叠（打开即暂停） ====================== */
  function toggleCoverage(open) {
    if (!sideDock) return;
    var isOpen = (open == null) ? (sideDock.getAttribute('data-open') !== 'true') : open;
    sideDock.setAttribute('data-open', isOpen ? 'true' : 'false');
    if (covToggle) covToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (isOpen) { FLOW.userPaused = true; clearTimer(); }   /* 打开即暂停；收起不自动恢复 */
    syncChrome();
  }

  /* ====================== 控件 ====================== */
  function resumeAuto() {
    if (FLOW.hardPaused || FLOW.ended) return;   /* 选择硬暂停 / 终局：继续播放不生效 */
    FLOW.userPaused = false;
    if (document.hidden) return;
    /* P2：已有待推进的计时器时不抢跑、不缩短阅读时间 */
    if (FLOW.timer != null) return;
    var remaining = Math.max(0, (FLOW.minUntil || 0) - Date.now());
    var delay = Math.max(120, remaining);
    if (MODE === 'demo') {
      var ph = baseState().phase;
      if (ph === 'ev26') scheduleNext(delay, demoAdvanceFrom26);
      else if (ph === 'feedback') scheduleNext(delay, demoAdvanceFromFeedback);
      else if (ph === 'ev33') scheduleNext(delay, demoFinish);
    } else if (MODE === 'custom' && LIFE.active) {
      var step = currentStep();
      if (step) scheduleNext(delay, drive);
    }
    syncChrome();
  }
  function backToLatest() { FLOW.autoFollow = true; scrollToLatest(true); }   /* 只滚动，不解暂停 */

  /* ====================== 绑定 ====================== */
  function bind() {
    stageEl = document.getElementById('stage');
    covRoot = document.getElementById('covRoot');
    logList = document.getElementById('log');
    headerWho = document.getElementById('whoLabel');
    headerWhat = document.getElementById('whatLabel');
    ageLabelEl = document.getElementById('ageLabel');

    if (stageEl) { stageEl.style.display = 'none'; }

    storyStream = document.createElement('main');
    storyStream.id = 'storyStream';
    storyStream.className = 'story-stream';
    storyStream.setAttribute('aria-live', 'polite');

    sideDock = document.createElement('section');
    sideDock.id = 'sideDock';
    sideDock.className = 'side-dock';
    sideDock.setAttribute('data-open', 'false');
    var covPanel = document.querySelector('section.coverage');
    var logPanel = document.querySelector('section.panel[aria-label="已发生"]');
    covStatusEl = document.createElement('p');
    covStatusEl.className = 'cov-summary';
    sideDock.appendChild(covStatusEl);
    if (covPanel) sideDock.appendChild(covPanel);
    if (logPanel) sideDock.appendChild(logPanel);

    flowDock = document.createElement('div');
    flowDock.className = 'flow-dock';
    flowDock.innerHTML =
      '<button class="btn ghost" type="button" data-flow-act="resume">继续播放</button>' +
      '<button class="btn ghost" type="button" data-flow-act="latest">回到最新</button>' +
      '<button class="btn ghost" type="button" data-flow-act="cov">状态与已发生</button>' +
      '<button class="btn ghost" type="button" data-flow-act="restart">重开</button>';

    titleRoot = document.createElement('section');
    titleRoot.id = 'titleRoot';
    titleRoot.className = 'title-root';

    var wrap = document.querySelector('.wrap');
    var header = wrap.querySelector('header.head');
    header.parentNode.insertBefore(titleRoot, header.nextSibling);
    titleRoot.parentNode.insertBefore(storyStream, titleRoot.nextSibling);
    storyStream.parentNode.insertBefore(flowDock, storyStream.nextSibling);
    flowDock.parentNode.insertBefore(sideDock, flowDock.nextSibling);
    var actions = wrap.querySelector('.actions');
    if (actions) { sideDock.parentNode.appendChild(actions); }

    titleRoot.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-act]'); if (!t) return;
      var act = t.getAttribute('data-act');
      if (act === 'enterDemo') enterDemo();
      else if (act === 'startCustom') startCustom();
    });
    titleRoot.addEventListener('change', function (ev) {
      var t = ev.target; if (t && t.id === 't_mode') {
        var w = document.getElementById('t_ageWrap'); if (w) w.style.display = (t.value === 'jump-to-age') ? 'block' : 'none';
      }
    });
    storyStream.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-flow-choice],[data-flow-act]'); if (!t) return;
      var cid = t.getAttribute('data-flow-choice');
      if (cid) { if (MODE === 'demo') demoChoose(cid); else if (MODE === 'custom') lifeChoose(cid); return; }
      var act = t.getAttribute('data-flow-act');
      if (act === 'restartDemo') demoEnter();
      else if (act === 'restartLife') { if (LIFE.state) startCustom(LIFE.state.player); }
      else if (act === 'toTitle') resetToTitle();
    });
    flowDock.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-flow-act]'); if (!t) return;
      var act = t.getAttribute('data-flow-act');
      if (act === 'resume') resumeAuto();
      else if (act === 'latest') backToLatest();
      else if (act === 'cov') toggleCoverage();
      else if (act === 'restart') restartCurrent();
    });

    window.addEventListener('scroll', function () {
      var near = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 140;
      if (!near && !FLOW.autoFollow) return;
      if (!near) FLOW.autoFollow = false;
      else FLOW.autoFollow = true;
    }, { passive: true });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { clearTimer(); }
      else if (!FLOW.hardPaused && !FLOW.userPaused && !FLOW.ended) { resumeAuto(); }
    });

    var btnReset = document.getElementById('btnReset');
    var btnJump = document.getElementById('btnJump');
    if (btnReset) btnReset.addEventListener('click', function () { restartCurrent(); });
    if (btnJump) btnJump.addEventListener('click', function () {
      if (MODE === 'demo') demoJump();
      else if (MODE === 'title') { enterDemo(); demoJump(); }
    });

    titleRoot.innerHTML = titleHTML();
    setMode('title');
  }

  /* ====================== __SJ 钩子 ====================== */
  /* 演示钩子语义恢复（与自动播放入口隔离）：直接驱动到底本对应相位，追加片段，
     不造 timer、不在后台推进。newRun 取消任何待触发的自动回调。 */
  function hookEnterDemo() {
    if (MODE !== 'demo' || FLOW.ended) {
      LIFE.active = false; LIFE.state = null; setMode('demo'); demoEnterDirect();
    }
  }
  SJ.state = function () { return LIFE.active ? LIFE.state : baseState(); };
  SJ.next26 = function () { newRun(); hookEnterDemo(); if (baseState().phase === 'ev26') { baseNext26(); reflectDemo(); } };
  SJ.choose = function (id) { newRun(); hookEnterDemo(); if (baseState().phase === 'choose' && !baseState().settled) { baseChoose(id); reflectDemo(); } };
  SJ.next33 = function () { newRun(); hookEnterDemo(); if (baseState().phase === 'feedback') { baseNext33(); reflectDemo(); } };
  SJ.finish = function () { newRun(); hookEnterDemo(); if (baseState().phase === 'ev33') { baseFinish(); reflectDemo(); } };
  SJ.reset = function () {
    if (LIFE.active) { startCustom(LIFE.state.player); return; }   /* 自选原地重开，清保障态 */
    newRun(); LIFE.active = false; LIFE.state = null; setMode('demo'); demoEnterDirect();
  };
  SJ.jump = function () {
    if (LIFE.active) return;                  /* 跳龄属演示样段语义 */
    newRun(); LIFE.active = false; LIFE.state = null; setMode('demo'); demoJumpDirect();

  function allocatedTotal(mode, profileId, scenarioId, resourceId) {
    var prefix = [mode, profileId, scenarioId, resourceId].join('|'), total = 0;
    for (var k in allocations) if (k.indexOf(prefix + '|') === 0) total += allocations[k];
    return total;
  }
  function resetAllocations(mode, profileId, scenarioId) {
    var prefix = [mode, profileId, scenarioId].join('|');
    for (var k in allocations) if (k.indexOf(prefix) === 0) delete allocations[k];
  }

  /* K11: 危疾现金流 —— 收入替代目标法，周期必填 */
  function calcCI(monthlyIncome, lossPct, months, extraMonthly, period) {
    if (!period) return { need: null, status: 'unknown', reason: 'K02: 周期缺失' };
    var monthlyLoss = (period === 'month') ? monthlyIncome * lossPct : (monthlyIncome / 12) * lossPct;
    var need = (monthlyLoss + extraMonthly) * months;
    return { need: need, status: 'known', basis: 'income-replacement',
      detail: { monthlyLoss: monthlyLoss, extraMonthly: extraMonthly, months: months,
        formula: '(' + monthlyIncome + (period === 'month' ? '/月' : '/年÷12') + '×' +
          (lossPct * 100) + '%+' + extraMonthly + '/月)×' + months + '月=' + need } };
  }
  /* K11 准备对照：清单完整度与给付核证独立 */
  function calcCIWithPrep(ciResult, prep) {
    var knownPrep = (prep.resources || 0) + (prep.benefitVerified ? (prep.benefit || 0) : 0);
    if (ciResult.need == null) return { need: null, preparation: knownPrep, balance: null, completeness: prep.inventoryComplete, status: 'unknown' };
    if (prep.inventoryComplete === true) {
      var bal = Math.max(0, ciResult.need - knownPrep);
      return { need: ciResult.need, preparation: knownPrep, balance: bal, completeness: true, status: 'known', knownGap: bal };
    }
    var knownGap = Math.max(0, ciResult.need - knownPrep);
    return { need: ciResult.need, preparation: knownPrep, balance: null, completeness: prep.inventoryComplete,
      status: 'unknown', knownGap: knownGap, reason: '清单不完整，最终缺口unknown' };
  }

  /* K12 遗属责任
     P1 修复：受养状态未答时，寿险责任是 unknown，不得输出 0。
     - 不传任何参数（无显式输入）→ 视为「受养状态未答」→ unknown。
     - 显式传 0（经济独立/已确认无责任）→ known 0。
     - 数字/其它组合仍按原公式计算，规则不变。 */
  function calcSurvivor(netAnnualContribution, years, debt, educationFund) {
    if (arguments.length === 0) {
      return { need: null, status: 'unknown', basis: 'survivor-responsibility', reason: '受养状态未答' };
    }
    var need = 0;
    if (netAnnualContribution != null && years != null) need += netAnnualContribution * years;
    if (debt != null) need += debt;
    if (educationFund != null) need += educationFund;
    return { need: need, status: 'known', basis: 'survivor-responsibility' };
  }
  function calcSurvivorWithPrep(result, lifeBenefit, resources, opts) {
    opts = opts || {};
    var knownPrep = (resources || 0) + (lifeBenefit || 0);
    if (result.need == null) return { need: null, preparation: knownPrep, balance: null, status: 'unknown' };
    var balance = Math.max(0, result.need - knownPrep), excess = Math.max(0, knownPrep - result.need);
    return { need: result.need, preparation: knownPrep, balance: balance, excess: excess,
      status: 'known', educationNotRecounted: opts.educationRef || null };
  }
  /* K05 时间账本：期初资源/给付到账，债务与教育期初支付，生活贡献每年末支付，零收益零通胀 */
  function calcSurvivorTimeline(netAnnualContribution, years, debt, educationFund, openingResources, openingBenefit) {
    var cash = (openingResources || 0) + (openingBenefit || 0);
    var upFront = (debt || 0) + (educationFund || 0);
    cash -= upFront;
    var firstShortfallYear = null, firstShortfallAmount = null;
    for (var y = 1; y <= years; y++) {
      if (cash < netAnnualContribution) {
        firstShortfallYear = y; firstShortfallAmount = netAnnualContribution - cash; break;
      }
      cash -= netAnnualContribution;
    }
    var totalNeed = netAnnualContribution * years + upFront;
    var totalPrep = (openingResources || 0) + (openingBenefit || 0);
    return { firstShortfallYear: firstShortfallYear, firstShortfallAmount: firstShortfallAmount,
      totalUncovered: Math.max(0, totalNeed - totalPrep), totalNeed: totalNeed, totalPrep: totalPrep,
      basis: 'K05-零收益零通胀-期初到账' };
  }

  /* K22 轴构造 */
  function buildAxis(a) {
    var N = a.need, P = a.preparation, q = null, rRatio = null, status = 'valid';
    if (a.statusOverride) status = a.statusOverride;
    if (status === 'valid') {
      if (N == null || N === 'unknown') { status = 'unknown'; N = null; }
      else if (N === 'notApplicable') { status = 'notApplicable'; N = null; }
      else if (N === 0) { status = 'zeroTarget'; }
      else if (P == null || P === 'unknown') { status = 'prepUnknown'; }
      else { q = P / N; rRatio = Math.min(q, 1); }
    }
    return {
      key: a.key, label: a.label, expenseId: a.expenseId,
      need: N, preparation: P, currency: a.currency || 'HKD', period: a.period || '12m',
      asOf: a.asOf || null, scenarioId: a.scenarioId || null,
      q: q, rRatio: rRatio, status: status, statusNote: a.statusNote || null,
      uncovered: (N != null && P != null && status === 'valid') ? Math.max(0, N - P) : null,
      excess: (N != null && P != null && status === 'valid') ? Math.max(0, P - N) : null
    };
  }
  function buildRadar(axes, opts) {
    opts = opts || {};
    return {
      scenarioId: opts.scenarioId || (axes[0] && axes[0].scenarioId) || null,
      currency: opts.currency || (axes[0] && axes[0].currency) || 'HKD',
      asOf: opts.asOf || (axes[0] && axes[0].asOf) || null,
      basis: opts.basis || null, horizon: opts.horizon || null,
      prepComplete: opts.prepComplete !== false,
      inventoryNote: opts.inventoryNote || null,
      axes: axes.map(buildAxis),
      allocations: opts.allocations || null,
      disclosure: opts.disclosure || null
    };
  }

  /* 完整虚构预设的计算输入（与集成层 PRESET 数值一致，非现实建议） */
  var DEFAULT_PRESET = {
    scenarioId: 'ci-income-replacement-12m', asOf: 'fictional-40-event-start', currency: 'HKD',
    period: '12m', horizon: 'future-12-months', basis: 'income-replacement',
    income: 360000, incomePeriod: 'year', lossPct: 0.5, months: 12,
    extraCare: 2000, extraRehab: 1000,
    reserveId: 'R1', reserveAmount: 36000,
    benefitId: 'B1', benefitAmount: 100000, benefitVerified: true,
    inventoryComplete: true
  };

  /* K22 从可编辑资料重算雷达（INC / CARE / REHAB 三轴，同场景/币种/期间/时点） */
  function computeFromProfile(p, overrides) {
    p = p || DEFAULT_PRESET; overrides = overrides || {};
    var incNeed = calcCI(p.income, p.lossPct, p.months, 0, p.incomePeriod).need;
    var careNeed = p.extraCare * p.months;
    var rehabNeed = p.extraRehab * p.months;
    /* 分配：给付先给 INC，储备 R1 三等分（A1/A2/A3） */
    var reserveEach = Math.round((p.reserveAmount / 3) * 100) / 100;
    var incPrep = (p.benefitVerified ? p.benefitAmount : 0) + reserveEach;
    var carePrep = reserveEach;
    var rehabPrep = reserveEach;
    var invComplete = overrides.inventoryComplete != null ? overrides.inventoryComplete : p.inventoryComplete;
    var axes = [
      { key: 'INC', label: '收入替代', expenseId: 'INC', need: incNeed, preparation: incPrep },
      { key: 'CARE', label: '净照护', expenseId: 'CARE', need: careNeed, preparation: carePrep },
      { key: 'REHAB', label: '净康复', expenseId: 'REHAB', need: rehabNeed, preparation: rehabPrep }
    ];
    /* 状态覆盖（P未知 / N=0 / 条款待核 / 不适用 等）—— 仅用于核对，不预填本人 */
    if (overrides.axisStatus) {
      Object.keys(overrides.axisStatus).forEach(function (k) {
        axes.forEach(function (a) { if (a.key === k) { a.statusOverride = overrides.axisStatus[k].status; a.statusNote = overrides.axisStatus[k].note; } });
      });
    }
    var allocations = [
      { resourceId: p.benefitId, benefitId: p.benefitId, allocationId: 'A_INC_B1', expenseId: 'INC', amount: p.benefitVerified ? p.benefitAmount : 0 },
      { resourceId: p.reserveId, allocationId: 'A_INC_R1', expenseId: 'INC', amount: reserveEach },
      { resourceId: p.reserveId, allocationId: 'A_CARE_R1', expenseId: 'CARE', amount: reserveEach },
      { resourceId: p.reserveId, allocationId: 'A_REHAB_R1', expenseId: 'REHAB', amount: reserveEach }
    ];
    var totalUncovered = axes.reduce(function (s, a) {
      return s + ((a.statusOverride ? 0 : (a.need != null && a.preparation != null ? Math.max(0, a.need - a.preparation) : 0)));
    }, 0);
    return buildRadar(axes, {
      scenarioId: p.scenarioId, currency: p.currency, asOf: p.asOf, basis: p.basis, horizon: p.horizon,
      prepComplete: invComplete === true,
      inventoryNote: invComplete === true ? null : '清单不完整：已核部分仅作下限，完整准备未知',
      allocations: allocations,
      disclosure: '情景内各轴相对目标；跨轴不可比，面积不是评分。仅计本情景已确认可用准备，不保证给付；未知/待核及资料完整性见明细。'
    });
  }

  /* K22 固定绘图例：N=[180000,24000,12000] P=[112000,12000,12000] */
  function k22FixedRadar() {
    var r = computeFromProfile(DEFAULT_PRESET);
    r.totalUncovered = 80000; /* 仅该单事件、同期间互不重叠费用底账验算，不作跨险种总缺口 */
    r.referenceRadii = [1, 1, 1];
    r.prepRadii = r.axes.map(function (a) { return a.rRatio; });
    return r;
  }

  /* 状态变体：验证 P未知 / N=0 / 待核 / 不适用 / q>1 / 清单不全 / 不足3轴 */
  function k22Variant(kind) {
    var base = k22FixedRadar();
    if (kind === 'incomplete') {
      var r = computeFromProfile(DEFAULT_PRESET, { inventoryComplete: false });
      return r;
    }
    if (kind === 'prepUnknown') {
      return computeFromProfile(DEFAULT_PRESET, { axisStatus: { CARE: { status: 'prepUnknown', note: '准备未知' } } });
    }
    if (kind === 'zeroTarget') {
      return computeFromProfile(DEFAULT_PRESET, { axisStatus: { REHAB: { status: 'zeroTarget', note: '无正目标，比例不适用' } } });
    }
    if (kind === 'notApplicable') {
      return computeFromProfile(DEFAULT_PRESET, { axisStatus: { CARE: { status: 'notApplicable', note: '不适用' } } });
    }
    if (kind === 'unknownTarget') {
      return computeFromProfile(DEFAULT_PRESET, { axisStatus: { INC: { status: 'unknown', note: '目标待核' } } });
    }
    if (kind === 'exceed') {
      var p = JSON.parse(JSON.stringify(DEFAULT_PRESET));
      p.benefitAmount = 250000; /* INC P=262000 > N=180000 → q>1 */
      return computeFromProfile(p);
    }
    if (kind === 'pendingTerms') {
      var p2 = JSON.parse(JSON.stringify(DEFAULT_PRESET));
      p2.benefitVerified = false; /* 名义100000条款待核，不进半径，仅明细列示 */
      return computeFromProfile(p2, { inventoryNote: '定额给付名义100000条款待核，仅列明细不入半径' });
    }
    if (kind === 'under3') {
      var r3 = computeFromProfile(DEFAULT_PRESET);
      r3.axes = r3.axes.slice(0, 2); /* 有效轴<3 → 不足以绘雷达 */
      return r3;
    }
    return base;
  }

  /* 六固定边界例 */
  function runFixture(num) {
    switch (num) {
      case 1: {
        var a = calcCI(30000, 0.5, 12, 3000, 'month');
        var b = calcCI(360000, 0.5, 12, 3000, 'year');
        var c = calcCI(30000, 0.5, 12, 3000, 'year');
        var d = calcCI(30000, 0.5, 12, 3000, null);
        return {
          case1a: { need: a.need, expected: 216000 },
          case1b: { need: b.need, expected: 216000 },
          case1c: { need: c.need, expected: 51000 },
          case1d: { need: d.need, expected: null, status: d.status }
        };
      }
      case 2: {
        var ci = calcCI(30000, 0.5, 12, 3000, 'month');
        var r2a = calcCIWithPrep(ci, { resources: 36000, benefit: 100000, benefitVerified: true, inventoryComplete: false });
        var r2b = calcCIWithPrep(ci, { resources: 36000, benefit: 100000, benefitVerified: true, inventoryComplete: true });
        var r2c = calcCIWithPrep(ci, { resources: 36000, benefit: 100000, benefitVerified: false, inventoryComplete: true });
        var r2d = calcCIWithPrep(ci, { resources: 36000, benefit: 0, benefitVerified: true, inventoryComplete: true });
        return {
          case2a: { knownPrep: r2a.preparation, expected: 136000, knownGap: r2a.knownGap, expectedGap: 80000, balance: r2a.balance, expectedBalance: null },
          case2b: { knownPrep: r2b.preparation, expected: 136000, balance: r2b.balance, expectedBalance: 80000 },
          case2c: { knownPrep: r2c.preparation, expected: 36000, balance: r2c.balance, expectedBalance: 180000, reason: '条款待核不抵' },
          case2d: { knownPrep: r2d.preparation, expected: 36000, balance: r2d.balance, expectedBalance: 180000 }
        };
      }
      case 3: {
        var surv = calcSurvivor(120000, 10, 300000, 500000);
        var tl = calcSurvivorTimeline(120000, 10, 300000, 500000, 200000, 1000000);
        var r3 = calcSurvivorWithPrep(surv, 1000000, 200000, { educationRef: 'E1/R1' });
        return {
          need: surv.need, expected: 2000000,
          preparation: r3.preparation, expected: 1200000,
          balance: r3.balance, expected: 800000,
          firstShortfallYear: tl.firstShortfallYear, expectedFirstShortfallYear: 4,
          educationNotRecounted: true
        };
      }
      case 4: {
        var death = calcSurvivor(0, 0, 500000, 0);
        var r4a = calcSurvivorWithPrep(death, 800000, 0);
        var ci4 = { need: 300000, status: 'known' };
        var r4b = calcCIWithPrep(ci4, { resources: 0, benefit: 0, benefitVerified: true, inventoryComplete: true });
        return {
          deathNeed: death.need, deathPrep: r4a.preparation, deathBalance: r4a.balance, deathExcess: r4a.excess,
          ciNeed: ci4.need, ciPrep: r4b.preparation, ciBalance: r4b.balance,
          noCrossOffset: true
        };
      }
      case 5: {
        /* P1 修复：两例均走真实 calcSurvivor，不再用字面量。
           经济独立：显式传 0（无贡献/无债务/无教育），得到 known 0；
           受养未答：不传参，得到 unknown，need=null，不输出 0。 */
        var surv5 = calcSurvivor(0, 0, 0, 0); /* 经济独立，已确认无责任 → known 0 */
        var unknownSurv = calcSurvivor();      /* 受养状态未答 → unknown */
        return { independent: surv5, unanswered: unknownSurv };
      }
      case 6: {
        var fCI = calcCI(30000, 0.5, 12, 0, 'month');
        var sCI = calcCI(20000, 0.5, 12, 0, 'month');
        return { fictionNeed: fCI.need, expectedF: 180000, selfNeed: sCI.need, expectedS: 120000, isolated: true };
      }
      default: return null;
    }
  }

  var KernelV2 = {
    SPEC_VERSION: SPEC_VERSION,
    initFiction: initFiction, initSelf: initSelf, resetSubject: resetSubject, getSubject: getSubject, isIsolated: isIsolated,
    money: money, toAnnual: toAnnual, toMonthly: toMonthly,
    calcCI: calcCI, calcCIWithPrep: calcCIWithPrep, calcSurvivor: calcSurvivor, calcSurvivorWithPrep: calcSurvivorWithPrep,
    calcSurvivorTimeline: calcSurvivorTimeline, buildAxis: buildAxis, buildRadar: buildRadar,
    computeFromProfile: computeFromProfile, k22FixedRadar: k22FixedRadar, k22Variant: k22Variant,
    runFixture: runFixture, resetAllocations: resetAllocations, allocate: allocate, allocatedTotal: allocatedTotal,
    DEFAULT_PRESET: DEFAULT_PRESET
  };
  window.__KernelV2 = KernelV2;
})();

</script>
<script id="rev08-radar">
/* =====================================================================
   RadarChart — K22 保险雷达 SVG 渲染
   参考半径恒为 R；准备半径 R×min(q,1)；q>1 双圈+外向箭头。
   不做面积分/总分/覆盖率；清单不全只画空心下限离散点，不闭合填充。
   N=0/未知/待核/不适用/P未知 均断开，不作0半径、不跨缺轴连线。
   ===================================================================== */
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fmt(n) { return (n == null) ? '—' : Number(n).toLocaleString('zh-CN'); }
  function statusText(ax) {
    return ({ unknown: '目标待核', notApplicable: '不适用', zeroTarget: '无正目标', prepUnknown: '准备未知' })[ax.status] || '有效';
  }

  /* 判断准备序列是否可作闭合值线：全部轴 valid 且 prepComplete */
  function prepLineValid(radarData) {
    var axes = radarData.axes || [];
    if (radarData.prepComplete === false) return false;
    return axes.length >= 3 && axes.every(function (a) { return a.status === 'valid' && a.rRatio != null; });
  }

  function renderRadar(radarData, opts) {
    opts = opts || {};
    var axes = radarData.axes || [];
    var n = axes.length;
    var validCount = axes.filter(function (a) { return a.status === 'valid' && a.rRatio != null; }).length;
    if (n < 3 || validCount < 3) {
      var st = axes.map(function (a) {
        return '<li>' + esc(a.label) + '：' + esc(statusText(a)) +
          (a.statusNote ? '（' + esc(a.statusNote) + '）' : '') + '</li>';
      }).join('');
      return '<div class="radar-insufficient"><p>资料不足以绘可比雷达（有效轴不足 3 个）。</p>' +
        '<ul class="radar-status-list">' + st + '</ul>' +
        '<p class="note">按 K22 不静默删轴凑闭合多边形；上方为各轴数值状态，明细见下表。unknown/待核/目标0/不适用均不作0半径、不跨缺轴连线。</p></div>';
    }

    var size = opts.size || 300, cx = size / 2, cy = size / 2, R = size * 0.30;
    var radPad = Math.round(size * 0.22);   /* rev11 第8项：向外扩 viewBox，给轴标签留边 */
    var angles = [], i;
    for (i = 0; i < n; i++) angles.push(-Math.PI / 2 + i * 2 * Math.PI / n);
    function pt(angle, radius) { return [cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius]; }

    var svg = '<svg class="radar-svg" viewBox="' + (-radPad) + ' ' + (-radPad) + ' ' + (size + 2 * radPad) + ' ' + (size + 2 * radPad) + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="保险雷达：' + esc(radarData.scenarioId || '危疾收入替代') + '">';
    for (var g = 1; g <= 4; g++) {
      var gr = R * g / 4;
      var gpts = angles.map(function (a) { return pt(a, gr).join(','); }).join(' ');
      svg += '<polygon points="' + gpts + '" fill="none" stroke="#d4c8a8" stroke-width="0.6" opacity="' + (0.28 + g * 0.12) + '"/>';
    }
    for (i = 0; i < n; i++) {
      var ep = pt(angles[i], R);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + ep[0] + '" y2="' + ep[1] + '" stroke="#b9ad93" stroke-width="0.6" opacity="0.5"/>';
    }

    /* 参考需要序列：恒为 R 的闭合多边形（dash 区分） */
    var refPts = angles.map(function (a) { return pt(a, R).join(','); }).join(' ');
    svg += '<polygon points="' + refPts + '" fill="rgba(47,111,82,0.05)" stroke="#2f6f52" stroke-width="1.6" stroke-dasharray="5 3"/>';

    var lineValid = prepLineValid(radarData);
    var prepPts = [], hollow = [];
    for (i = 0; i < n; i++) {
      var ax = axes[i];
      if (ax.status === 'valid' && ax.rRatio != null) {
        prepPts.push(pt(angles[i], R * ax.rRatio));
      } else if (ax.preparation != null && ax.need != null && ax.need > 0) {
        /* 清单不全/待核的已核下限：空心离散点 */
        hollow.push({ idx: i, pt: pt(angles[i], R * Math.min(ax.preparation / ax.need, 1)) });
      }
    }
    if (lineValid) {
      svg += '<polygon points="' + prepPts.map(function (p) { return p.join(','); }).join(' ') +
        '" fill="rgba(224,169,79,0.20)" stroke="#e0a94f" stroke-width="1.8"/>';
    } else {
      /* 断开：只在有效轴上画实心点，不连线；清单不全画空心点 */
      prepPts.forEach(function (p) { svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.2" fill="#e0a94f" stroke="#fff" stroke-width="0.8"/>'; });
    }
    hollow.forEach(function (h) {
      svg += '<circle cx="' + h.pt[0] + '" cy="' + h.pt[1] + '" r="4.5" fill="none" stroke="#e0a94f" stroke-width="1.6" stroke-dasharray="2,2"/>';
    });

    /* q>1：双圈 + 外向箭头，端点封顶于 R */
    for (i = 0; i < n; i++) {
      var ax2 = axes[i];
      if (ax2.status === 'valid' && ax2.q != null && ax2.q > 1) {
        var e = pt(angles[i], R), beyond = pt(angles[i], R * 1.16);
        svg += '<circle cx="' + e[0] + '" cy="' + e[1] + '" r="5.5" fill="none" stroke="#c4442f" stroke-width="1.8"/>';
        svg += '<line x1="' + e[0] + '" y1="' + e[1] + '" x2="' + beyond[0] + '" y2="' + beyond[1] +
          '" stroke="#c4442f" stroke-width="1.8" marker-end="url(#r05arrow)"/>';
      }
    }
    svg += '<defs><marker id="r05arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c4442f"/></marker></defs>';

    /* 轴标签 + q/状态 + 原金额 */
    for (i = 0; i < n; i++) {
      var a = axes[i], lp = pt(angles[i], R * 1.20);
      var anchor = Math.cos(angles[i]) > 0.3 ? 'start' : (Math.cos(angles[i]) < -0.3 ? 'end' : 'middle');

  function switchTab(name) {

    var storyOn = (name === 'story');

    for (var k in panes) {
      var p = el(panes[k]);
      if (p) p.classList.toggle('is-active', (k === name));
    }

    if (tabbar) {

  /* rev10-mobile：菜单开合——点按钮展开/收起，点菜单项或空白处关闭 */
  function bindMenuAndTabs() {
    var btn = el('r10MenuBtn');
    var menu = el('r10Menu');
    if (btn && menu) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var open = menu.style.display !== 'none';
        menu.style.display = open ? 'none' : 'block';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      });
      /* 点任一菜单项后关闭菜单（data-r05 的业务仍由 bindR05 处理） */
      menu.addEventListener('click', function (ev) {
        if (ev.target.closest && ev.target.closest('button[data-r05]')) {
          menu.style.display = 'none';
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    }
    var tabbar = el('r10Tabbar');
    if (tabbar) {
      tabbar.addEventListener('click', function (ev) {
        var b = ev.target.closest && ev.target.closest('button[data-tab]');
        if (b) { switchTab(b.getAttribute('data-tab')); closeMenu(); }
      });
    }
    document.addEventListener('click', function (ev) {
      if (menu && menu.style.display !== 'none' &&
          !(ev.target.closest && ev.target.closest('#r10Menu, #r10MenuBtn'))) {
        closeMenu();
      }
    }, true);
    function closeMenu() {
      if (menu) menu.style.display = 'none';
      if (btn) btn.setAttribute('aria-expanded', 'false');

  }

  function renderLifeGrid(full) {

      '<span class="legend-item future">未到达</span><span class="legend-item unexperienced">跳龄前未经历</span></div><div class="grid-cells">';
    ages.forEach(function (g) {
      var evs = hist.filter(function (h) { return h.age === g; });

      if (jumpedBefore) cls += ' unexperienced';
      else if (g === age) cls += ' current';
      else if (evs.length || g < age) cls += ' done';
      else cls += ' future';

        '<span class="grid-label">' + esc(labels[g] || '') + '</span>' + (evs.length ? '<span class="grid-dot"></span>' : '') + '</div>';
    });
    html += '</div>';
    if (full) html += '<p class="grid-note">点格子仅定位历史，不结算、不推进。跳龄前格子标“未经历”，不伪造选择；未来刻度不代表对本人寿命的预测。</p>';

  /* rev08 改动2：按 DOM 顺序给每条 story-item 加轻量「年份 · 地点」标记。
     底本只负责正文与 history；这里只加表现层标记元素，不改 story-item 生成逻辑与顺序。 */
  function stampEvents(age) {
    var stream = el('storyStream'); if (!stream) return;
    var items = stream.querySelectorAll('.story-item');
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.getAttribute('data-r08-year')) continue;
      it.setAttribute('data-r08-year', '1');
      var mark = document.createElement('div');
      mark.className = 'r08-stamp';
      /* 用该条发生时的剧情年龄推年份：优先 history 中对应条目的 age，回退当前 age */
      var evAge = inferItemAge(it, i, age);
      mark.textContent = (BIRTH_YEAR + evAge) + ' · ' + placeNow();
      it.insertBefore(mark, it.firstChild);
    }
    /* 当前正在发生的那条高亮：优先底本 .focus（待选/终点）；
       日常 quiet 段无 focus 时，高亮最新追加的一条，保证「正在发生」始终可见 */
    var focus = stream.querySelector('.story-item.focus');
    var current = focus || items[items.length - 1];
    for (var j = 0; j < items.length; j++) {
      if (items[j] === current) items[j].classList.add('r08-live');
      else items[j].classList.remove('r08-live');
    }
  }
  function inferItemAge(item, idx, currentAge) {
    /* 尽力从条目文本里的「N 岁」或 history 推断；失败则用当前年龄 */
    var st = currentState(), hist = (st && st.history) || [];
    var txt = (item.textContent || '').slice(0, 120);
    var m = txt.match(/(\d{1,3})\s*岁/);
    if (m) return parseInt(m[1], 10);
    if (hist.length && idx < hist.length && typeof hist[idx].age === 'number') return hist[idx].age;
    return (typeof currentAge === 'number') ? currentAge : 0;
  }
  /* rev08 改动3：结局的虚构人数块——明确「虚构人群示意」，无真实统计/产品品牌/金额总计 */
  function maybeShowCrowd() {
    if (APP.crowdShown) return;
    var st = currentState(), life = LIFEState();
    var ended = (st && st.phase === 'done') || (life && life.phase === 'ended') || (typeof SJ.flowState === 'function' && SJ.flowState().ended);
    if (!ended) return;
    var stream = el('storyStream'); if (!stream) return;
    APP.crowdShown = true;
    var box = document.createElement('div');
    box.className = 'r08-crowd'; box.id = 'r08Crowd';
    box.innerHTML = '<div class="r08-crowd-h">和你走过这条路的人</div>' +
      '<div class="r08-crowd-n">约 ' + FICTIONAL_COHORT + ' 人</div>' +
      '<p class="r08-crowd-note">虚构人群示意 · 非真实统计、非人数调查，不代表任何产品或品牌。</p>';
    stream.appendChild(box);
    /* 仅尝试把结果块带入视野，不改变底本暂停/跟随语义 */
    try { box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
  }

  function stateSignature() {
    var st = currentState(), life = LIFEState();
    return [APP.mode, APP.subject, modeNow(), st && st.age, st && st.phase, st && st.history && st.history.length,
      life && life.idx, life && life.flags ? Object.keys(life.flags).filter(function (k) { return life.flags[k]; }).join(',') : '',
      APP.inventoryOverride, APP.selfDraft.income, APP.selfDraft.period, APP.selfDraft.existing,

  function poll() {
    var sig = stateSignature();
    if (sig !== APP.lastSig) { APP.lastSig = sig; syncChrome(); }
  }

  /* ======================= 上区 v10 交互 ======================= */
  function syncV10Road() {
    var st = currentState(), age = (st && st.age) || 0;
    if (age >= 0) APP.v10.visited['出生'] = true;
    if (age >= 7) APP.v10.visited['年岁'] = true;
    if (APP.v10.role) APP.v10.visited['职业'] = true;
    if (APP.v10.gearTaken) APP.v10.visited['代价'] = true;
    if (APP.v10.prophet.length) APP.v10.visited['先知'] = true;
    if (APP.v10.witch.length) APP.v10.visited['巫者'] = true;
  }
  function openPicker(kind) {
    ensureOverlays();
    var isProphet = kind === 'prophet';
    var opts = isProphet ? PROPHET_OPTIONS : WITCH_OPTIONS;
    var chosen = isProphet ? APP.v10.prophet : APP.v10.witch;
    setText('pickTitle', isProphet ? '先知 · 家族线索（可多选／可跳）' : '巫者 · 现病线索（可多选／可跳）');
    var h = '<p class="note">' + (isProphet ? '先知摊开一本旧册。看清楚这些，是为了更明白自己。可多选，也可以先不取。未取的线索，结算不会编造。' : '巫者问你自己现在有哪些状态要盯着。看清楚，是为了更好地照顾自己。结算不编造现病，也不因此提高保险对照。') + '</p>';
    h += '<div class="pick-options">';
    opts.forEach(function (o, idx) {
      var exclusive = (!isProphet && o === '暂时没有');
      h += '<label class="pick-opt"><input type="checkbox" data-pick="' + idx + '"' + (chosen.indexOf(o) >= 0 ? ' checked' : '') + (exclusive ? ' data-exclusive="1"' : '') + '/> ' + esc(o) + '</label>';
    });
    h += '</div><div class="btn-row"><button class="btn primary" type="button" data-r05="pickSave" data-kind="' + kind + '">记录</button>' +
      '<button class="btn ghost" type="button" data-r05="pickSkip">跳过（不记录）</button></div>';
    el('pickBody').innerHTML = h;
    show(el('pickOverlay'), true);
  }
  function savePick(kind) {
    var isProphet = kind === 'prophet';
    var opts = isProphet ? PROPHET_OPTIONS : WITCH_OPTIONS;
    var boxes = el('pickBody').querySelectorAll('input[data-pick]');
    var picked = [];
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].checked) {
        var o = opts[parseInt(boxes[i].getAttribute('data-pick'), 10)];
        if (boxes[i].getAttribute('data-exclusive') === '1') { picked = [o]; break; }
        picked.push(o);
      }
    }
    if (isProphet) APP.v10.prophet = picked; else APP.v10.witch = picked;
    syncV10Road(); closeOverlay(); syncChrome();
  }

  /* ======================= 事件绑定 ======================= */
  function bindR05() {
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest && ev.target.closest('[data-r05]'); if (!t) return;
      var a = t.getAttribute('data-r05');
      if (a === 'openEnter' || a === 'openSkip') { closeOpening(); }
      else if (a === 'subjectFiction') startFiction();
      else if (a === 'subjectSelf') { KV2.initSelf(); showSelfForm(); }
      else if (a === 'subjectDemo') startDemo();
      else if (a === 'selfSubmit') commitSelf();
      else if (a === 'selfSkip') { APP.selfDraft = { age:'', income:'', period:'', existing:'' }; startFiction(); }
      else if (a === 'resume') { if (SJ.__resume) SJ.__resume(); }
      else if (a === 'latest') { backToLive(); }
      else if (a === 'grid') openGrid();
      else if (a === 'radar') openRadar();
      else if (a === 'radarMode') toggleRadarMode();
      else if (a === 'closeOverlay') closeOverlay();
      else if (a === 'restart') restartAll();
      else if (a === 'editProfile') openProfile();
      else if (a === 'setGender' || a === 'pfGender') {
        var g = t.getAttribute('data-gender');
        APP.profile.gender = (g === 'na') ? 'na' : g;
        /* 同步分段按钮高亮（开局或面板两处） */
        ['r08GenderSeg','pfGenderSeg'].forEach(function (sid) {
          var seg = el(sid); if (!seg) return;
          [].forEach.call(seg.querySelectorAll('[data-gender]'), function (b) {
            b.className = (b.getAttribute('data-gender') === APP.profile.gender) ? 'on' : '';
          });
        });
        syncChrome();
      }
      else if (a === 'pfSave') saveProfile();
      else if (a === 'v10role') {
        if (APP.subject === 'self' && !window.confirm) { /* 本人须自愿，仍允许点选但不预填 */ }
        APP.v10.role = t.getAttribute('data-role');
        APP.v10.gearTaken = false; APP.v10.removed = [];
        syncV10Road(); syncChrome();
      }
      else if (a === 'v10takegear') { APP.v10.gearTaken = true; syncV10Road(); syncChrome(); }
      else if (a === 'v10remove') {
        var c = roleClass();
        if (c && APP.v10.gearTaken && APP.v10.removed.length === 0) APP.v10.removed.push(parseInt(t.getAttribute('data-idx'), 10));
        syncV10Road(); syncChrome();
      }
      else if (a === 'v10prophet') openPicker('prophet');
      else if (a === 'v10witch') openPicker('witch');
      else if (a === 'pickSave') savePick(t.getAttribute('data-kind'));
      else if (a === 'pickSkip') closeOverlay();
    });
  }

     复用底本 backToLatest 语义：只滚动、恢复 autoFollow、不解暂停 */
  function backToLive() {
    if (typeof SJ.backToLatest === 'function') { SJ.backToLatest(); return; }
    var stream = el('storyStream'); if (!stream) return;
    var target = stream.lastElementChild;

  }
  function restartAll() {

    KV2.resetSubject('fiction'); KV2.resetSubject('self');

    APP.stamped = []; APP.crowdShown = false; /* rev08：重开清除事件标记/结局块标记 */

    showGate();
    syncChrome();
  }

  /* ======================= 启动 ======================= */
  function start() {
    APP.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    buildShell();
    ensureOverlays();
    bindR05();
    bindMenuAndTabs();
    show(el('r05Shell'), false);
    showOpening();
    syncChrome();
    setInterval(poll, 180);
  }
  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(fn, 0); });
    else setTimeout(fn, 0);
  }
  ready(start);

  window.__REV06 = { APP: APP, PRESET: PRESET, V10_CLASSES: V10_CLASSES, V10_ROAD_NODES: V10_ROAD_NODES,
    startFiction: startFiction, startDemo: startDemo, showSelfForm: showSelfForm, commitSelf: commitSelf,
    openRadar: openRadar, openGrid: openGrid, syncChrome: syncChrome, stateSignature: stateSignature,
    backToLive: backToLive, sceneFor: sceneFor, renderScene: renderScene };
  window.__REV08 = { APP: APP, BIRTH_YEAR: BIRTH_YEAR, FICTIONAL_COHORT: FICTIONAL_COHORT,
    openProfile: openProfile, saveProfile: saveProfile, honorific: honorific, placeNow: placeNow,
    stampEvents: stampEvents, maybeShowCrowd: maybeShowCrowd };
})();

  }
  function installSummaryHooks() {
    var hook = window.__SJ = window.__SJ || {};
    hook.exportSummary = exportSummary;
    hook.onSummary = function (cb) {
      if (typeof cb !== 'function') return;
      hook._sjSummaryCbs = hook._sjSummaryCbs || [];
      hook._sjSummaryCbs.push(cb);
      if (APP09.summaryShown) {
        try { cb(exportSummary()); } catch (e) {}
      }
    };
  }
  function poemBlockHtml() {
    return '<div class="r09-gift">' +
      '<p class="r09-gift-lead">' + esc(POEM_LEAD) + '</p>' +
      '<p class="r09-gift-verse">' + esc(POEM_LINE) + '</p>' +
      '<p class="r09-gift-attr">' + esc(POEM_ATTR) + '</p></div>';
  }
  function renderSummary() {
    var stream = el('storyStream');
    if (!stream || !stream.insertAdjacentHTML) return;
    var facts = summaryFacts();
    var rows = facts.map(function (f) {
      return '<div class="r09-sum-row"><span>' + esc(f[0]) + '</span><b>' + esc(f[1]) + '</b></div>';
    }).join('');
    var needsHtml = Object.keys(APP09.needs).map(function (d) {
      return '<li><span>' + esc(d) + '</span><b>' + esc(LEVEL_TEXT[APP09.needs[d]] || '未知') + '</b></li>';
    }).join('') || '<li class="empty">未产生需求线索</li>';
    /* F：小结卡雷达用按选择生成的准备状态，不再固定预设 */
    var radarSvg = '';
    try {
      if (RC) radarSvg = RC.renderRadar(buildLivingRadar(), { subject: '关键选择' });
    } catch (e) { radarSvg = '<p class="r09-note">雷达图暂不可用</p>'; }
    var fic = fictionTag();
    var tag = fic ? (fic + ' · 非建议') : '非建议';
    var canShare = false;
    try { canShare = !!(navigator.share); } catch (e3) { canShare = false; }
    stream.insertAdjacentHTML('beforeend',
      '<div class="r09-summary" id="r09Summary">' +
      '<div class="r09-sum-h">' + propIcon('lantern', '小结') + '<b>人生小结卡</b><span>' + esc(tag) + '</span></div>' +
      '<p class="r09-sum-brand">' + esc(PRODUCT_NAME) + '</p>' +
      '<div class="r09-sum-grid"><div class="r09-sum-facts"><h5>关键选择</h5>' + rows + '</div>' +
      '<div class="r09-sum-radar"><h5>准备状态雷达（随选择变化）</h5>' + radarSvg +
      '<h5>需求线索</h5><ul class="r09-sum-needs">' + needsHtml + '</ul></div></div>' +
      '<p class="r09-note">' + esc(COPY.summaryNote) + '</p>' +
      poemBlockHtml() +
      '<div class="r09-sum-actions"><button type="button" class="btn" data-r09="saveImg">保存图片</button>' +
      '<button type="button" class="btn" data-r09="copyText">复制摘要</button>' +
      (canShare ? '<button type="button" class="btn" data-r09="shareSum">分享</button>' : '') +
      '<span class="r09-copy-status" id="r09CopyStatus"></span></div>' +
      '<p class="r09-privacy">' + esc(PRIVACY_NOTICE) + '</p></div>');
    notifySummaryReady();
  }
  function canvasWrapText(x, text, tx, ty, maxW, lineH) {
    var chars = String(text || '').split('');
    var line = '';
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (x.measureText(test).width > maxW && line) {
        x.fillText(line, tx, ty);
        ty += lineH;
        line = chars[i];
      } else line = test;
    }
    if (line) { x.fillText(line, tx, ty); ty += lineH; }
    return ty;
  }
  function paintSummaryCanvas(c) {
    var facts = summaryFacts();
    var needs = needsLines();
    var fic = fictionTag();
    var lines = 8 + facts.length + Math.max(needs.length, 1) + 8;
    c.width = 900;
    /* rev12：保存/分享图片顶部加入落日像素场景（828×276，3:1） */
    var sjBan = null; try { sjBan = window.__SJ_PX_BANNER ? window.__SJ_PX_BANNER() : null; } catch (eB) { sjBan = null; }
    var sjBH = sjBan ? 300 : 0;
    c.height = Math.max(920, 160 + lines * 32) + sjBH;
    var x = c.getContext('2d');
    x.fillStyle = '#fffdf7'; x.fillRect(0, 0, c.width, c.height);
    if (sjBan) { try { x.imageSmoothingEnabled = false; x.drawImage(sjBan, 36, 24, 828, 276); x.imageSmoothingEnabled = true; x.translate(0, sjBH); } catch (eD) {} }
    x.fillStyle = '#23362b'; x.font = 'bold 28px sans-serif';
    x.fillText('人生小结卡', 36, 52);
    x.font = '16px sans-serif'; x.fillStyle = '#3d5a45';
    x.fillText(PRODUCT_NAME + (fic ? '  ·  ' + fic : ''), 36, 84);
    x.font = '20px sans-serif'; x.fillStyle = '#31463a';
    var y = 130;
    facts.forEach(function (f) {
      y = canvasWrapText(x, '· ' + f[0] + '：' + f[1], 36, y, 828, 30);
    });
    y += 10;
    x.fillStyle = '#31463a'; x.font = '18px sans-serif';
    x.fillText('需求线索（非精算，未知≠0）', 36, y); y += 32;
    x.font = '18px sans-serif';
    if (!needs.length) { x.fillText('· 未产生需求线索', 36, y); y += 30; }
    needs.forEach(function (f) {
      y = canvasWrapText(x, '· ' + f[0] + '：' + f[1], 36, y, 828, 28);
    });
    y += 18;
    x.fillStyle = '#5c6b5f'; x.font = '16px sans-serif';
    x.fillText(POEM_LEAD, 36, y); y += 32;
    x.fillStyle = '#1f2a24'; x.font = '22px serif';
    x.fillText(POEM_LINE, 36, y); y += 34;
    x.fillStyle = '#7a7a68'; x.font = '16px sans-serif';
    x.fillText(POEM_ATTR, 36, y); y += 40;
    x.fillStyle = '#5c6b5f'; x.font = '15px sans-serif';
    y = canvasWrapText(x, PRIVACY_NOTICE, 36, y, 828, 24);
    return c;
  }
  function saveSummaryImage() {
    try {
      var c = document.createElement('canvas');
      paintSummaryCanvas(c);
      var a = document.createElement('a');
      a.download = '人生小结卡.png'; a.href = c.toDataURL('image/png');
      if (a.click) a.click();
    } catch (e) {
      var s = el('r09CopyStatus'); if (s) s.textContent = '当前环境不支持保存图片，请用复制摘要。';
    }
  }
  function copySummaryText() {
    var txt = summaryText();
    var done = function () { var s = el('r09CopyStatus'); if (s) s.textContent = '已复制摘要，可发给顾问。'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        if (document.execCommand) document.execCommand('copy');
        if (ta.parentNode) ta.parentNode.removeChild(ta);
        done();
      } catch (e2) { var s = el('r09CopyStatus'); if (s) s.textContent = '复制失败，请手动选择文字。'; }
    }
  }
  function shareSummary() {
    var txt = summaryText();
    var title = PRODUCT_NAME;
    if (!navigator.share) return;
    function shareTextOnly() {
      return navigator.share({ title: title, text: txt });
    }
    try {
      var c = document.createElement('canvas');
      paintSummaryCanvas(c);
      var go = function (blob) {
        var run = shareTextOnly;
        if (blob) {
          try {
            var file = new File([blob], '人生小结卡.png', { type: 'image/png' });
            var packed = { title: title, text: txt, files: [file] };
            if (!navigator.canShare || navigator.canShare(packed)) {
              run = function () { return navigator.share(packed); };
            }
          } catch (e2) {}
        }
        run().catch(function (err) {
          if (err && err.name === 'AbortError') return;
          shareTextOnly().catch(function () {});
        });
      };
      if (c.toBlob) c.toBlob(function (blob) { go(blob); }, 'image/png');
      else go(null);
    } catch (e) {
      shareTextOnly().catch(function () {});
    }
  }

  function relabelTop() {
    var btns = document.querySelectorAll ? document.querySelectorAll('[data-r05="latest"],[data-flow-act="latest"]') : [];
    for (var i = 0; i < btns.length; i++) btns[i].textContent = '回到顶部';
  }
  function ensureReverse() {
    var stream = el('storyStream');
    if (stream && stream.classList && !stream.classList.contains('r09-reverse')) stream.classList.add('r09-reverse');
  }

  function poll09() {
    var m = mode();
    if (m !== 'custom' && m !== 'demo') return;
    var age = curAge();
    var f = flow();
    ensureReverse();
    installTopArt();
    injectCards(age);
    scanFlow();
    /* rev08 的 syncChrome 会周期性重建保障区 DOM，导致 r09Needs 面板丢失；幂等补装 */
    if (!el('r09Needs')) renderNeeds();
    if (f.ended) {
      if (!APP09.summaryShown) { APP09.summaryShown = true; renderSummary(); }
      return;
    }
    if (gateActive()) return;
    if (f.hardPaused) return;
    var g = pickNextGate(age);
    if (g) openGate(g);
  }

  function start() {
    if (APP09.started) return;
    if (typeof setInterval !== 'function' || !document.createElement ||
        !document.createElement('div').insertAdjacentHTML) return;
    APP09.started = true;
    try {
      ensureGateBox();
      installTopArt();
      relabelTop();
      bindClicks();
      setInterval(poll09, 200);
      poll09();
    } catch (e) { /* 不影响底本 */ }
  }
  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(fn, 0); });
    else setTimeout(fn, 0);
  }
  ready(start);

  /* 供自测断言使用（不参与游戏逻辑） */
    installSummaryHooks();
  window.__REV09 = {
    COPY: COPY, TOP_ART_SVG: TOP_ART_SVG, GATES: GATES, INJECTS: INJECTS,
    APP: APP09,
    state: function () { return JSON.parse(JSON.stringify(APP09)); },
    answerGate: answerGate, skipGate: skipGate, pickNextGate: pickNextGate,
    summaryText: summaryText, summaryFacts: summaryFacts, exportSummary: exportSummary, recomputeNeeds: recomputeNeeds,
    buildLivingRadar: buildLivingRadar,
    renderSummary: renderSummary, renderNeeds: renderNeeds, installTopArt: installTopArt,
    scanFlow: scanFlow, clip40: clip40
  };
})();

</script>

      /* 水墨图保留：开局选择卡顶部 + 人生小结卡（诗句上方） */
      var gc = document.querySelector('#subjectGate .gate-card');
      if (gc) inkInto(gc, gc.firstChild, 'sj-ink-gate');
      var sum = el('r09Summary');
      if (sum) { var hd = sum.querySelector('.r09-sum-h'); inkInto(sum, hd ? hd.nextSibling : null, 'sj-ink-sum'); }
    } catch (e) {}
  }
  window.__SJ_PX.stageKey = stageKey;
  window.__SJ_PX.tick = tick;
  function go() { tick(); setInterval(tick, 200); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(go, 0); });
  else setTimeout(go, 0);
})();
</script>
